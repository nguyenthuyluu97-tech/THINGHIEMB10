SIMS.division = rt => {
  const c = rt.canvas(800, 420), ctx = c.ctx;
  let n = 0, phase = 0, anim = false;
  const sN = rt.slider({ label: "Số lần phân chia (n)", min: 0, max: 6, step: 1, value: 0, onInput: v => { n = v; phase = 0; anim = false; } });
  rt.button("Phân chia", () => { if (n >= 6) { rt.info("Đã đạt 6 lần phân chia (64 tế bào). Kéo thanh về 0 để làm lại."); return; } anim = true; phase = 0; }, true);
  const roN = rt.readout("Số tế bào", "1"), roF = rt.readout("Công thức");
  rt.loop(dt => {
    if (anim) { phase += dt * 0.55; if (phase >= 1) { anim = false; phase = 0; n++; sN.inp.value = n; sN.inp.dispatchEvent(new Event("input")); } }
    const count = 1 << n; roN(String(count)); roF(`2^${n} = ${count}`);
    c.clear();
    const area = { x: 20, y: 20, w: 470, h: 380 };
    const cols = Math.ceil(Math.sqrt(count * area.w / area.h)), rows = Math.ceil(count / cols);
    const cell = Math.min(area.w / cols, area.h / rows), r0 = cell * 0.36;
    const grow = anim ? Math.min(1, phase / 0.45) : 0, split = anim ? clamp((phase - 0.45) / 0.55, 0, 1) : 0;
    for (let i = 0; i < count; i++) {
      const cx = area.x + (i % cols + .5) * (area.w / cols), cy = area.y + (Math.floor(i / cols) + .5) * (area.h / rows);
      const r = r0 * (1 + 0.28 * grow);
      if (split > 0) {
        const off = r * 0.75 * split, rr = r * (1 - 0.25 * split);
        ctx.fillStyle = "rgba(247,190,205,.95)"; ctx.strokeStyle = "#c2417a"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(cx - off, cy, rr, 0, TAU); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(cx + off, cy, rr, 0, TAU); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#7b4fc9"; [cx - off, cx + off].forEach(x => { ctx.beginPath(); ctx.arc(x, cy, rr * .3, 0, TAU); ctx.fill(); });
      } else {
        ctx.fillStyle = "rgba(247,190,205,.95)"; ctx.strokeStyle = "#c2417a"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#7b4fc9"; const nd = grow > 0.7 ? (grow - 0.7) / 0.3 * r * 0.35 : 0;
        ctx.beginPath(); ctx.arc(cx - nd, cy, r * .3 - nd * .2, 0, TAU); ctx.fill(); if (nd) { ctx.beginPath(); ctx.arc(cx + nd, cy, r * .3 - nd * .2, 0, TAU); ctx.fill(); }
      }
    }
    // sơ đồ cây bên phải
    const X = 520; txt(ctx, "Sơ đồ phân chia", X, 30, { color: ink(), size: 14, w: 700 });
    for (let lv = 0; lv <= Math.min(n, 5); lv++) {
      const k = 1 << lv, y = 66 + lv * 62;
      txt(ctx, `${lv} lần → ${k}`, X, y, { color: muted(), size: 12 });
      for (let i = 0; i < k; i++) { const x = X + 100 + (i + .5) * (170 / k); ctx.fillStyle = "#f7becd"; ctx.strokeStyle = "#c2417a"; ctx.beginPath(); ctx.arc(x, y, Math.min(9, 70 / k), 0, TAU); ctx.fill(); ctx.stroke(); if (lv < Math.min(n, 5)) { ctx.strokeStyle = muted(); ctx.lineWidth = .8; [(i * 2 + .5) * (170 / (k * 2)), (i * 2 + 1.5) * (170 / (k * 2))].forEach(x2 => { ctx.beginPath(); ctx.moveTo(x, y + 8); ctx.lineTo(X + 100 + x2, y + 54); ctx.stroke(); }); } }
    }
    if (n > 5) txt(ctx, `6 lần → 64`, X, 66 + 6 * 62 - 20, { color: muted(), size: 12 });
  });
  rt.info("Mỗi lần phân chia: tế bào lớn lên, <b>nhân phân chia trước</b>, sau đó chất tế bào phân chia tạo hai tế bào con.");
};

}

  const hy = []; const rnd = seeded(3); for (let k = 0; k < 14; k++) { let p = { x: 0, y: -.1, z: 0 }; const pts = [p]; const a = k / 14 * TAU; for (let j = 0; j < 7; j++) { p = { x: p.x + Math.cos(a + rnd() - .5) * .45, y: p.y - .12 - rnd() * .1, z: p.z + Math.sin(a + rnd() - .5) * .45 }; pts.push(p); } hy.push(sc.add(M3.tube(pts, .035, { color: "#fbf7ee" }, 4))); }
  let spores = false; const sp = M3.points([], { color: "#7a4a2a", size: 3 }); sc.add(sp);

    { name: "Cuống nấm", desc: "Nâng đỡ mũ nấm.", objs: [stem, ring], at: { x: .45, y: 1.3, z: .2 }, lab: { dx: 60, dy: 10 } },
    { name: "Sợi nấm", desc: "Nằm trong đất hoặc chất hữu cơ, hút chất dinh dưỡng. Nấm sống dị dưỡng, không có diệp lục.", objs: hy, at: { x: -1.6, y: -.7, z: .8 }, lab: { dx: -60, dy: 30 } },
    { name: "Bào tử", desc: "Rơi ra từ phiến nấm, gặp nơi ẩm sẽ nảy mầm thành sợi nấm mới. Bật “Thả bào tử” để quan sát.", objs: [], at: { x: -1.4, y: 2.6, z: .8 }, lab: { dx: -70, dy: 30 } }
  ], "Nấm đảm (nấm mũ) gồm mũ nấm, phiến nấm, cuống nấm và sợi nấm. Bấm vào từng phần.");

SIMS.plants3d = rt => {
  const sc = new M3.Scene(rt, { dist: 10, yaw: 0.6, pitch: 0.2, target: { x: 0, y: 2.2, z: 0 }, H: 500 });
  const leaf = (x, y, z, l, w, ry, rz, col = "#3f9a3a") => { const m = M3.ellipsoid(l, .03, w, { color: col, ds: true, pos: { x, y, z } }, 12, 6); m.verts.forEach(v => v.x += l); m.ry = ry; m.rz = rz; return m; };
  const soil = () => sc.add(M3.cyl(3.4, 3.4, .25, 28, { color: "#7a5636", pos: { x: 0, y: -.25, z: 0 } }));
  const roots = (n, len, col = "#c9a27a", r = .05) => { const out = []; const rnd = seeded(9); for (let k = 0; k < n; k++) { let p = { x: 0, y: 0, z: 0 }; const pts = [p]; const a = k / n * TAU; for (let j = 0; j < 6; j++) { p = { x: p.x + Math.cos(a) * len * .12 + (rnd() - .5) * .2, y: p.y - len * .15, z: p.z + Math.sin(a) * len * .12 + (rnd() - .5) * .2 }; pts.push(p); } out.push(sc.add(M3.tube(pts, r, { color: col }, 4))); } return out; };
  const INFO = ["<b>Rêu</b>: không có mạch dẫn, rễ giả, sinh sản bằng bào tử.", "<b>Dương xỉ</b>: có mạch dẫn, rễ thật, sinh sản bằng bào tử (ở mặt dưới lá).", "<b>Hạt trần</b>: có mạch, có hạt nằm lộ trên lá noãn, chưa có hoa và quả; cơ quan sinh sản là nón.", "<b>Hạt kín</b>: có mạch, có hoa, quả; hạt được bảo vệ trong quả."];
  modelSwitcher(rt, sc, ["Rêu", "Dương xỉ", "Hạt trần (thông)", "Hạt kín"], i => {
    sc.objs = []; sc.labels = []; const P = [];
    soil();
    if (i === 0) {
      sc.target = { x: 0, y: 1.2, z: 0 }; const stems = [], lv = [], caps = [], setae = [];
      const rnd = seeded(4);
      for (let k = 0; k < 9; k++) { const x = (rnd() - .5) * 2.4, z = (rnd() - .5) * 2.4, h = .9 + rnd() * .5; stems.push(sc.add(M3.cyl(.05, .04, h, 6, { color: "#5a8a2a", pos: { x, y: 0, z } }))); for (let j = 0; j < 10; j++) lv.push(leaf(x, .15 + j * h / 11, z, .22, .07, j * 2.1, .5, "#5fae3a")); if (k % 3 === 0) { const s = M3.cyl(.025, .025, 1.6, 5, { color: "#b07b3a", pos: { x, y: h, z } }); setae.push(sc.add(s)); const cp = M3.ellipsoid(.1, .22, .1, { color: "#8a5a2a", pos: { x, y: h + 1.7, z } }); caps.push(sc.add(cp)); } }
      const leafM = sc.add(M3.merge(lv, { color: "#5fae3a", ds: true }));
      const rz = roots(10, 1.2, "#d8c4a0", .02);
      P.push({ name: "Thân", desc: "Thân ngắn, nhỏ, chưa có mạch dẫn.", objs: stems, at: stems[0].pos, lab: { dx: -60, dy: -10 } }, { name: "Lá", desc: "Lá nhỏ, mỏng, chưa có mạch dẫn.", objs: [leafM], at: { x: stems[1].pos.x, y: .7, z: stems[1].pos.z }, lab: { dx: 60, dy: -20 } }, { name: "Túi bào tử", desc: "Nằm trên cuống dài; bào tử phát tán, gặp nơi ẩm phát triển thành cây rêu mới.", objs: [...caps, ...setae], at: caps[0].pos, lab: { dx: 40, dy: -30 } }, { name: "Rễ giả", desc: "Những sợi nhỏ bám vào đất, chưa phải rễ thật.", objs: rz, at: { x: .4, y: -.5, z: .4 }, lab: { dx: 50, dy: 30 } });
    } else if (i === 1) {
      sc.target = { x: 0, y: 1.8, z: 0 }; const fr = [], pin = [], sori = [];
      for (let k = 0; k < 6; k++) {
        const a = k / 6 * TAU; const pts = []; for (let j = 0; j <= 10; j++) { const t = j / 10; pts.push({ x: Math.cos(a) * t * 2.6, y: t * 3.2 - t * t * 1.2, z: Math.sin(a) * t * 2.6 }); }
        fr.push(M3.tube(pts, .04, {}, 5));
        for (let j = 2; j <= 9; j++) { const p = pts[j], L = .55 * (1 - j / 12); [-1, 1].forEach(s => { pin.push(leaf(p.x, p.y, p.z, L, .11, -a + s * Math.PI / 2 + Math.PI, 0, "#3f8f3a")); if (k === 0 && s > 0) sori.push(sc.add(M3.sphere(p.x + Math.cos(-a + Math.PI / 2 + Math.PI) * L * .9, p.y - .06, p.z - Math.sin(-a + Math.PI / 2 + Math.PI) * L * .9, .06, "#8a4a1a"))); }); }
      }
      const curl = []; for (let j = 0; j <= 30; j++) { const t = j / 30, r = .5 * (1 - t * .8); curl.push({ x: .2 + Math.sin(t * 9) * r * t, y: 1.2 + t * .9 + Math.cos(t * 9) * r * t * .6, z: .2 }); }
      const young = sc.add(M3.tube(curl, .05, { color: "#7ac35a" }, 5));

SIMS.foodweb = rt => {

  rt.slider({ label: "Chặt phá rừng", min: 0, max: 100, step: 5, value: 0, unit: "%", onInput: v => cut = v });
  rt.button("Khôi phục tất cả", () => { N.forEach(n => n.on = true); });
  const roB = rt.readout("Số loài còn sống"), roI = rt.readout("Độ ổn định hệ sinh thái");
  rt.drag(c, { down: p => { const n = N.find(n => Math.hypot(n.x - p.x, n.y - p.y) < 30); if (n) { n.on = !n.on; } return false; }, hover: p => N.some(n => Math.hypot(n.x - p.x, n.y - p.y) < 30) });
  rt.loop(dt => {

SIMS.ramp = rt => {
  const c = rt.canvas(800, 400), ctx = c.ctx;
  let h = 30, mb = 0.05, st = 0, s = 0, v = 0, bx = 0, bv = 0; const rec = [];
  rt.slider({ label: "Độ cao thả bóng", min: 10, max: 50, step: 5, value: 30, unit: "cm", onInput: val => { h = val; reset(); } });
  rt.seg(["Bóng nhẹ (50 g)", "Bóng nặng (200 g)"], 0, i => { mb = [0.05, 0.2][i]; reset(); });
  rt.button("Thả", () => { reset(); st = 1; }, true);
  function reset() { st = 0; s = 0; v = 0; bx = 0; bv = 0; }
  const roE = rt.readout("Thế năng ban đầu của bóng"), roD = rt.readout("Khúc gỗ dịch chuyển");
  const FLOOR = 340, RX0 = 60, RX1 = 340, SC = 5; // 1 cm = 5 px

    const H = h * SC, ang = Math.atan2(H, RX1 - RX0), L = Math.hypot(H, RX1 - RX0);
    const E = mb * 9.8 * h / 100; roE(fmt(E, 3) + " J");

    if (st === 2) { v = v; s += 0; bx += v * dt; if (bx > 0) { st = 3; const d = E * 70; bv = d; rec.push([h, mb, d]); } }
    let ballX, ballY; if (st < 2) { ballX = RX0 + s * Math.cos(ang); ballY = FLOOR - H + s * Math.sin(ang); } else { ballX = RX1 + Math.min(bx, 0); ballY = FLOOR; }
    const blockX0 = RX1 + 30; let bpos = 0; if (st === 3) { bpos = Math.min(bv, (bpos2 += dt * 140)); }
    roD(st === 3 ? fmt(bv, 1) + " cm" : "–");
    if (st === 3 && bpos >= bv - .1) rt.info(`Bóng ${mb === .2 ? "nặng" : "nhẹ"} thả từ ${h} cm đẩy khúc gỗ đi <b>${fmt(bv, 1)} cm</b>. Bóng ở càng cao, càng nặng thì <b>năng lượng càng lớn</b>, tác dụng lực lên khúc gỗ càng mạnh.`);
    c.clear(); const I = ink();
    ctx.fillStyle = isDark() ? "#2a3f4d" : "#cfd9de"; ctx.fillRect(0, FLOOR + 12, 800, 50);
    ctx.fillStyle = "#c89b6a"; ctx.beginPath(); ctx.moveTo(RX0, FLOOR - H); ctx.lineTo(RX1, FLOOR + 12); ctx.lineTo(RX0, FLOOR + 12); ctx.fill();
    ctx.fillStyle = "#a0703f"; ctx.fillRect(blockX0 + (st === 3 ? bpos * SC / 2 : 0), FLOOR - 28, 50, 40);
    const g = ctx.createRadialGradient(ballX - 4, ballY - 4, 1, ballX, ballY, mb > .1 ? 14 : 10); g.addColorStop(0, "#fff"); g.addColorStop(1, mb > .1 ? "#2b4f8a" : "#e07a12");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ballX, ballY - (mb > .1 ? 14 : 10) + 12, mb > .1 ? 14 : 10, 0, TAU); ctx.fill();
    // thước sàn
    for (let k = 0; k <= 80; k += 5) { const xx = blockX0 + k * SC / 2; ctx.strokeStyle = I; ctx.beginPath(); ctx.moveTo(xx, FLOOR + 14); ctx.lineTo(xx, FLOOR + (k % 10 ? 20 : 26)); ctx.stroke(); if (k % 10 === 0) txt(ctx, String(k), xx, FLOOR + 36, { size: 10, color: I, align: "center" }); }
    txt(ctx, "cm", blockX0 + 210, FLOOR + 36, { size: 10, color: muted() });
    txt(ctx, `h = ${h} cm`, RX0 - 10, FLOOR - H - 16, { color: I, size: 13 });
    // bảng
    txt(ctx, "Kết quả các lần thả", 590, 30, { color: I, size: 13, w: 700 }); rec.slice(-8).forEach((r, i) => txt(ctx, `h = ${r[0]} cm, ${r[1] * 1000} g → ${fmt(r[2], 1)} cm`, 590, 56 + i * 22, { color: I, size: 12, w: 500 }));
  });
  let bpos2 = 0; const _r = reset; reset = function () { _r(); bpos2 = 0; };

SIMS.skate = rt => {
  const c = rt.canvas(800, 420), ctx = c.ctx;
  const yOf = x => 330 - 0.0011 * (x - 400) ** 2 * 1.0 - 0 ; // máng hình chữ U (y màn hình)
  const H = x => (330 - yOf(x)) / 100; // độ cao (m)
  let x = 140, v = 0, fric = false, heat = 0, drag = false; const m = 1, g = 9.8;
  rt.toggle("Có ma sát", false, val => fric = val);
  rt.button("Đặt lại", () => { x = 140; v = 0; heat = 0; });
  rt.drag(c, { down: p => { if (Math.abs(p.x - x) < 26 && Math.abs(p.y - yOf(x) + 14) < 30) { drag = true; return; } return false; }, move: p => { x = clamp(p.x, 70, 730); v = 0; heat = 0; }, up: () => drag = false, hover: p => Math.abs(p.x - x) < 26 && Math.abs(p.y - yOf(x) + 14) < 30 });
  rt.hint("Kéo xe trượt lên máng rồi thả");
  rt.loop(dt => {
    if (!drag) for (let i = 0; i < 8; i++) {
      const h = dt / 8, sl = (yOf(x + .5) - yOf(x - .5)); const th = Math.atan(-sl); // góc dốc (dương: đi lên khi x tăng)
      let a = -g * Math.sin(th); if (fric && Math.abs(v) > .01) { const fa = 0.06 * g * Math.cos(th); a -= Math.sign(v) * fa; heat += fa * Math.abs(v) * h * m; }
      v += a * h; x += v * Math.cos(th) * h * 100; if (x < 60 || x > 740) { v = -v * .5; x = clamp(x, 60, 740); }
    }
    const PE = m * g * H(x), KE = .5 * m * v * v, tot = PE + KE + heat;
    c.clear(); const I = ink();
    ctx.strokeStyle = I; ctx.lineWidth = 5; ctx.beginPath(); for (let xx = 50; xx <= 750; xx += 5) xx === 50 ? ctx.moveTo(xx, yOf(xx)) : ctx.lineTo(xx, yOf(xx)); ctx.stroke();
    const sl = yOf(x + .5) - yOf(x - .5), an = Math.atan(sl);
    ctx.save(); ctx.translate(x, yOf(x)); ctx.rotate(an); ctx.fillStyle = "#e07a12"; roundRect(ctx, -22, -24, 44, 16, 5); ctx.fill(); ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(-13, -6, 6, 0, TAU); ctx.arc(13, -6, 6, 0, TAU); ctx.fill(); ctx.restore();
    // cột năng lượng
    const bars = [["Thế năng", PE, "#2e7dd7"], ["Động năng", KE, "#d9572b"], ["Nhiệt năng", heat, "#c2417a"], ["Tổng", tot, "#3c9a2f"]];
    const max = Math.max(3, tot);
    bars.forEach(([n, val, col], i) => { const bx = 290 + i * 60, bh = val / max * 110; ctx.fillStyle = col; ctx.fillRect(bx, 140 - bh, 40, bh); txt(ctx, n, bx + 20, 156, { size: 11, align: "center", color: I }); txt(ctx, fmt(val, 2) + " J", bx + 20, 130 - bh, { size: 10, align: "center", color: muted() }); });
    ctx.strokeStyle = muted(); ctx.beginPath(); ctx.moveTo(280, 140); ctx.lineTo(530, 140); ctx.stroke();
    if (!drag && Math.abs(v) < .05 && H(x) > .3) rt.info("Xe đang ở cao, đứng yên: chỉ có <b>thế năng</b>."); else if (H(x) < .03 && Math.abs(v) > .3) rt.info("Ở điểm thấp nhất: thế năng nhỏ nhất, <b>động năng lớn nhất</b>."); else if (fric) rt.info("Có ma sát: một phần cơ năng chuyển thành <b>nhiệt năng</b>, xe lên thấp dần. Tổng năng lượng không đổi.");
  });
  rt.info("Kéo xe lên cao rồi thả. Quan sát các cột năng lượng.");
};

      acc += dt; if (acc > 0.25) { acc = 0; hist.push({ t, i: temp(ICE, hI).T, w: temp(WAX, hW).T }); }
    }
    const I = temp(ICE, hI), W = temp(WAX, hW);
    roI(fmt(I.T, 1) + " °C"); roIs(name(I.f, mode)); roW(fmt(W.T, 1) + " °C"); roWs(name(W.f, mode));
    draw(I, W, now);
  });
  function beaker(x, y, label, sub, f, T, solidCol, liqCol, pieces, now) {
    const w = 120, h = 130, I = ink();
    // chất lỏng
    const lv = 30 + 45 * f;
    ctx.fillStyle = liqCol; if (f > 0) ctx.fillRect(x + 3, y + h - lv, w - 6, lv - 2);
    // mảnh rắn
    const n = Math.round(pieces * (1 - f)); const R = seeded(label.length);
    for (let i = 0; i < pieces; i++) { const px = x + 16 + R() * (w - 40), py = y + h - 22 - R() * 50, r = R() * 3; if (i >= n) continue; ctx.save(); ctx.translate(px + (f > 0 ? Math.sin(now * 2 + i) * 1.5 : 0), py); ctx.rotate(r); ctx.fillStyle = solidCol; roundRect(ctx, -12, -9, 24, 18, 4); ctx.fill(); ctx.fillStyle = "rgba(255,255,255,.45)"; ctx.fillRect(-9, -6, 6, 5); ctx.restore(); }
    ctx.strokeStyle = I; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x - 3, y); ctx.lineTo(x, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w + 3, y); ctx.stroke();
    // nhiệt kế
    const tx = x + w - 16, yT = v => y + h - 10 - clamp((v + 20) / 120, 0, 1) * (h + 60);
    ctx.fillStyle = "rgba(240,248,252,.95)"; roundRect(ctx, tx - 5, y - 70, 10, h + 66, 5); ctx.fill(); ctx.strokeStyle = "#8aa"; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = "#d12f2f"; ctx.beginPath(); ctx.arc(tx, y + h - 6, 7, 0, TAU); ctx.fill(); ctx.fillRect(tx - 2, yT(T), 4, y + h - 6 - yT(T));
    txt(ctx, fmt(T, 1) + " °C", tx + 10, y - 60, { size: 12, color: "#d12f2f", w: 700 });
    txt(ctx, label, x + w / 2, y + h + 22, { size: 13.5, align: "center", color: I, w: 700 });
    txt(ctx, sub, x + w / 2, y + h + 40, { size: 11.5, align: "center", color: muted(), w: 500 });
  }
  function draw(I, W, now) {
    c.clear(); const M = muted(), Ik = ink();
    beaker(30, 120, "Nước đá", "chất tinh khiết", I.f, I.T, "rgba(200,230,250,.95)", "rgba(90,170,235,.45)", 7, now);
    beaker(200, 120, "Sáp bút màu", "hỗn hợp", W.f, W.T, "#e07a12", "rgba(224,122,18,.75)", 9, now);
    if (mode > 0) for (let k = 0; k < 2; k++) for (let i = 0; i < 3; i++) { const fx = 60 + k * 170 + i * 30, h = 14 + Math.sin(now * 20 + i + k) * 3; ctx.fillStyle = "rgba(255,140,40,.85)"; ctx.beginPath(); ctx.moveTo(fx - 7, 286); ctx.quadraticCurveTo(fx, 286 - h * 2, fx + 7, 286); ctx.fill(); }
    if (mode < 0) txt(ctx, "❄ làm lạnh", 175, 290, { size: 14, align: "center", color: "#2e7dd7", w: 700 });
    txt(ctx, "Đun (hoặc làm lạnh) cùng lúc, cùng tốc độ", 175, 40, { size: 12.5, align: "center", color: M });
    // đồ thị
    const gx = 400, gy = 50, gw = 375, gh = 320, tMax = Math.max(30, Math.ceil(t / 15) * 15);
    const X = v => gx + v / tMax * gw, Y = v => gy + gh - (v + 20) / 120 * gh;
    txt(ctx, "Nhiệt độ theo thời gian", gx, 30, { size: 14, color: Ik, w: 700 });
    ctx.strokeStyle = M; ctx.lineWidth = 1; ctx.strokeRect(gx, gy, gw, gh);
    for (let v = -20; v <= 100; v += 20) { txt(ctx, v + "°", gx - 6, Y(v), { size: 11, align: "right", color: M, w: 500 }); ctx.strokeStyle = "rgba(128,150,160,.18)"; ctx.beginPath(); ctx.moveTo(gx, Y(v)); ctx.lineTo(gx + gw, Y(v)); ctx.stroke(); }
    if (mark) {
      ctx.strokeStyle = "rgba(46,125,215,.7)"; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(gx, Y(0)); ctx.lineTo(gx + gw, Y(0)); ctx.stroke(); ctx.setLineDash([]);
      txt(ctx, "nước đá: đoạn NẰM NGANG ở đúng 0 °C", gx + gw - 6, Y(0) + 12, { size: 11, align: "right", color: "#1f5f8f", w: 700 });
      ctx.fillStyle = "rgba(231,161,15,.18)"; ctx.fillRect(gx, Y(62), gw, Y(52) - Y(62));
      txt(ctx, "sáp: TĂNG CHẬM trong khoảng 52–62 °C", gx + gw - 6, Y(62) - 9, { size: 11, align: "right", color: "#b07b00", w: 700 });
    }
    const line = (key, col) => { if (!hist.length) return; ctx.strokeStyle = col; ctx.lineWidth = 2.8; ctx.beginPath(); hist.forEach((d, i) => i ? ctx.lineTo(X(d.t), Y(d[key])) : ctx.moveTo(X(d.t), Y(d[key]))); ctx.stroke(); };
    line("i", "#2e7dd7"); line("w", "#d9572b");
    ctx.fillStyle = "#2e7dd7"; ctx.fillRect(gx + 10, gy + 10, 14, 3); txt(ctx, "nước đá", gx + 28, gy + 12, { size: 11, color: M });
    ctx.fillStyle = "#d9572b"; ctx.fillRect(gx + 90, gy + 10, 14, 3); txt(ctx, "sáp bút màu", gx + 108, gy + 12, { size: 11, color: M });
    txt(ctx, "thời gian →", gx + gw, gy + gh + 16, { size: 11, align: "right", color: M, w: 500 });
  }
  rt.info("Bấm <b>Đun nóng</b> để đun nước đá và sáp cùng lúc. So sánh hai đường: đường nào có <b>đoạn nằm ngang</b>, đường nào chỉ <b>tăng chậm</b> trong một khoảng? Sau đó bấm <b>Làm lạnh</b> để xem sự đông đặc.");
};

/* ============ Ứng dụng: mục lục, điều hướng, trang bài học ============ */
const App = (() => {
  const LESSONS = []; CHAPTERS.forEach((c, ci) => c.lessons.forEach(l => { l.ci = ci; LESSONS.push(l); }));
  let rt = null, curLesson = null, extra = [];
  const disposeAll = () => { if (rt) rt.dispose(); rt = null; extra.forEach(r => r.dispose()); extra = []; };
  const done = new Set(store.get("khtn6-done", []));
  const toc = $("#toc"), main = $("#main");

  function buildToc(filter = "") {
    toc.innerHTML = "";
    const f = filter.trim().toLowerCase();
    CHAPTERS.forEach((c, ci) => {
      const ls = c.lessons.filter(l => !f || (`bài ${l.n} ${l.t}`).toLowerCase().includes(f));
      if (!ls.length) return;
      const open = f || (curLesson ? curLesson.ci === ci : ci === 0);
      const d = el("div", { class: "chap" + (open ? " open" : ""), style: `--cc:var(--c${ci + 1})` });
      const b = el("button", { type: "button", "aria-expanded": String(!!open) }, el("span", { class: "num" }, c.roman), el("span", {}, c.t));
      b.onclick = () => { d.classList.toggle("open"); b.setAttribute("aria-expanded", d.classList.contains("open")); };
      const ul = el("ul");
      ls.forEach(l => ul.append(el("li", {}, el("a", { href: "#bai-" + l.n, class: (curLesson === l ? "cur " : "") + (done.has(l.n) ? "done" : "") },
        el("span", { class: "n" }, l.n), el("span", {}, l.t), el("span", { class: "k" + (l.kind === "3d" ? " d3" : "") }, l.kind === "3d" ? "3D" : "TN")))));
      d.append(b, ul); toc.append(d);
    });
    const pct = Math.round(done.size / LESSONS.length * 100);
    $("#prog").innerHTML = `Đã học ${done.size}/${LESSONS.length} bài<div class="bar"><i style="width:${pct}%"></i></div>`;
  }

  function benchShell(l) {
    const is3d = l.kind === "3d";
    return el("section", { class: "bench", "aria-label": "Bàn thí nghiệm" },
      el("div", { class: "bench-h" }, el("span", { class: "tag" + (is3d ? " d3" : "") }, is3d ? "Mô hình 3D" : "Thí nghiệm mô phỏng"), el("h2", {}, l.simTitle)),
      el("div", { class: "stage" }),
      el("div", { class: "readouts" }),
      el("div", { class: "info" }),
      el("div", { class: "ctrls" }),
      el("div", { class: "guide" }, el("b", {}, "Cách làm"), el("div", { html: l.how }), l.ask ? el("div", { class: "ask", html: "<b style='font-size:14.5px'>Em hãy trả lời:</b> " + l.ask }) : null));
  }
  function runIn(b, spec) {
    const r = new Runtime(b);
    try { SIMS[spec.sim](r, spec); } catch (e) { console.error(e); r.info("Không mở được mô phỏng này: " + e.message); }
    if (!r.ctrlEl.children.length) r.ctrlEl.style.display = "none";
    if (!r.roEl.children.length) r.roEl.style.display = "none";
    return r;
  }
  function benchFor(spec) { const b = benchShell(spec); extra.push(runIn(b, spec)); return b; }
  function sectionsView(l) {
    const out = [];
    out.push(el("div", { class: "card goalcard" }, el("b", {}, "Mục tiêu"), el("ul", {}, l.goals.map(g => el("li", {}, g)))));
    if (l.intro) out.push(el("div", { class: "opener", html: l.intro }));
    l.sections.forEach(sec => {
      const box = el("section", { class: "sec" }, el("h2", {}, el("span", { class: "rn" }, sec.no), sec.h));
      const part = (x, host) => {
        if (x.body) host.append(el("div", { class: "secbody", html: x.body }));
        if (x.sim) host.append(benchFor(x));
        (x.extra || []).forEach(e => host.append(benchFor(e)));
        if (x.q) host.append(el("div", { class: "qbox", html: "<span>?</span><div>" + x.q + "</div>" }));
      };
      part(sec, box);
      (sec.sub || []).forEach(sb => { const s2 = el("div", { class: "sub" }, el("h3", {}, sb.h)); part(sb, s2); box.append(s2); });
      out.push(box);
    });
    if (l.know) { const k = el("section", { class: "sec know" }, el("h2", {}, "Em có biết?")); k.append(el("div", { class: "secbody", html: l.know.body })); if (l.know.sim) k.append(benchFor(l.know)); out.push(k); }
    return out;
  }
  function mountSim(l) {
    if (rt) rt.dispose();
    const old = $(".bench", main); const b = benchShell(l);
    old ? old.replaceWith(b) : null;
    rt = new Runtime(b);
    try { SIMS[l.sim](rt, l); } catch (e) { console.error(e); rt.info("Không mở được mô phỏng này: " + e.message); }
    // các khung trống thì ẩn
    if (!rt.ctrlEl.children.length) rt.ctrlEl.style.display = "none";
    if (!rt.roEl.children.length) rt.roEl.style.display = "none";
    return b;
  }

  function lessonView(l) {
    disposeAll();
    curLesson = l; const c = CHAPTERS[l.ci]; const i = LESSONS.indexOf(l);
    main.innerHTML = "";
    main.style.setProperty("--cc", `var(--c${l.ci + 1})`);
    main.append(
      el("div", { class: "crumb" }, el("span", { class: "pill" }, "Chương " + c.roman), c.t),
      el("h1", { class: "ltitle" }, `Bài ${l.n}. ${l.t}`),
      el("div", { class: "lmeta" }, `SGK Khoa học tự nhiên 6 – Kết nối tri thức, trang ${l.p} · GV Nguyễn Thuỷ Lưu – THCS Nguyễn Du`),
      ...(l.sections ? [] : [el("section", { class: "bench" })]));
    if (l.sections) main.append(...sectionsView(l)); else mountSim(l);
    if (l.stem) { const st = el("section", { class: "sec stem", id: "stem" }, el("h2", {}, el("span", { class: "rn" }, "S"), l.stem.h), el("div", { class: "secbody", html: l.stem.body })); l.stem.benches.forEach(b => st.append(benchFor(b))); main.append(st); }
    if (l.stemLink) main.append(el("a", { class: "card stemlink", href: "#bai-" + l.stemLink[0] }, el("b", {}, "Dự án STEM liên quan → "), l.stemLink[1]));
    const q = el("div", { class: "card quiz" }, el("h3", {}, "Câu hỏi nhanh"));
    let answered = 0;
    l.quiz.forEach((qq, qi) => {
      const why = el("div", { class: "why" });
      const opts = el("div", { class: "opts" });
      qq[1].forEach((o, oi) => {
        const bt = el("button", { type: "button" }, String.fromCharCode(65 + oi) + ". " + o);
        bt.onclick = () => {
          [...opts.children].forEach((x, k) => { x.disabled = true; if (k === qq[2]) x.classList.add("ok"); });
          if (oi !== qq[2]) bt.classList.add("no");
          why.innerHTML = (oi === qq[2] ? "<b style='color:var(--good)'>Chính xác.</b> " : "<b style='color:var(--bad)'>Chưa đúng.</b> ") + qq[3];
          if (++answered === l.quiz.length) { done.add(l.n); store.set("khtn6-done", [...done]); buildToc($("#q").value); }
        };
        opts.append(bt);
      });
      q.append(el("div", { class: "q" }, el("p", {}, `${qi + 1}. ${qq[0]}`), opts, why));
    });
    main.append(el("div", { class: "cols" },
      l.sections ? el("div", { class: "card learned" }, el("h3", {}, "Em đã học"), el("ul", {}, l.points.map(p => el("li", { html: p }))), l.can ? el("div", { class: "can" }, el("b", {}, "Em có thể: "), l.can) : null) :
      el("div", { class: "card" },
        el("div", { class: "goals" }, el("b", {}, "Mục tiêu"), el("ul", {}, l.goals.map(g => el("li", {}, g)))),
        el("h3", {}, "Kiến thức trọng tâm"), el("ul", {}, l.points.map(p => el("li", { html: p })))),
      q));
    const prev = LESSONS[i - 1], next = LESSONS[i + 1];
    main.append(el("nav", { class: "pager", "aria-label": "Chuyển bài" },
      prev ? el("a", { href: "#bai-" + prev.n }, el("small", {}, "← Bài trước"), `Bài ${prev.n}. ${prev.t}`) : null,
      next ? el("a", { class: "next", href: "#bai-" + next.n }, el("small", {}, "Bài sau →"), `Bài ${next.n}. ${next.t}`) : null));
  }

  function homeView() {
    curLesson = null; disposeAll();
    main.innerHTML = ""; main.style.removeProperty("--cc");
    const n3 = LESSONS.filter(l => l.kind === "3d").length;
    const demo = el("section", { class: "bench", style: "border:0;box-shadow:none;background:none" }, el("div", { class: "stage" }), el("div", { class: "readouts" }), el("div", { class: "info" }), el("div", { class: "ctrls" }));
    main.append(el("div", { class: "hero" },
      el("div", {},
        el("div", { class: "byline" }, el("i", {}, "Tổ KHTN-CN"), el("span", {}, "Trường THCS Nguyễn Du")),
        el("h1", {}, "Khoa học tự nhiên 6, học bằng thí nghiệm"),
        el("p", { style: "margin:8px 0 0;color:var(--ink);font-weight:600" }, "Biên soạn: GV Nguyễn Thuỷ Lưu"),
        el("p", {}, "55 bài theo sách Kết nối tri thức với cuộc sống. Mỗi bài có một thí nghiệm mô phỏng hoặc mô hình 3D để em tự tay thay đổi, quan sát và rút ra kết luận, kèm kiến thức trọng tâm và câu hỏi tự kiểm tra."),
        el("div", { class: "stats" },
          el("div", {}, el("b", {}, "10"), el("small", {}, "chương")),
          el("div", {}, el("b", {}, "55"), el("small", {}, "bài học")),
          el("div", {}, el("b", {}, String(n3)), el("small", {}, "mô hình 3D")),
          el("div", {}, el("b", {}, String(55 - n3)), el("small", {}, "thí nghiệm mô phỏng")))),
      demo));
    rt = new Runtime(demo); SIMS.solar(rt, { home: true });
    rt.ctrlEl.style.display = "none"; rt.roEl.style.display = "none";
    const g = el("div", { class: "grid" });
    CHAPTERS.forEach((c, ci) => g.append(el("a", { class: "ccard", href: "#bai-" + c.lessons[0].n, style: `--cc:var(--c${ci + 1})` },
      el("small", {}, `Chương ${c.roman} · ${c.lessons.length} bài`), el("b", {}, c.t),
      el("div", { class: "ls" }, c.lessons.map(l => `Bài ${l.n}. ${l.t}`).join(" · ")))));
    main.append(el("h2", { style: "font-size:24px;margin:8px 0 12px" }, "Các chương"), g);
  }

  function route() {
    const h = location.hash.slice(1);
    const m = h.match(/^bai-(\d+)$/);
    const l = m && LESSONS.find(x => x.n === +m[1]);
    if (l) lessonView(l); else homeView();
    buildToc($("#q").value);
    $("#side").classList.remove("show");
    window.scrollTo(0, 0);
    if (l) { const a = $(".chap li a.cur"); a && a.scrollIntoView({ block: "nearest" }); }
  }
  window.addEventListener("hashchange", route);
  $("#q").addEventListener("input", e => buildToc(e.target.value));
  $("#menuBtn").addEventListener("click", () => $("#side").classList.toggle("show"));
  route();
  return { reloadSim() { if (curLesson) curLesson.sections ? lessonView(curLesson) : mountSim(curLesson); }, LESSONS };
})();
