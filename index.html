<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phòng thí nghiệm ảo KHTN 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: sidebar mục lục bên trái + vùng bài học; mỗi bài mở đầu bằng bàn thí nghiệm (mô phỏng/3D), rồi kiến thức và câu hỏi. */
:root{
  --bg:#eef3f2;
  --paper:#ffffff;
  --ink:#10283a;
  --muted:#557081;
  --line:#d3dfe0;
  --accent:#0b7d63;
  --accent-ink:#ffffff;
  --accent-soft:#dff1ea;
  --amber:#e7a10f;
  --amber-soft:#fdf1d4;
  --stage:#f7faf9;
  --stage-dark:#0d1b28;
  --good:#1c8a4a;
  --bad:#c0392b;
  --shadow:0 1px 2px rgba(16,40,58,.06),0 6px 20px rgba(16,40,58,.06);
  --font-display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --font-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --c1:#2e7dd7;--c2:#d9572b;--c3:#9a6b1f;--c4:#7b4fc9;--c5:#0b8a6a;--c6:#c2417a;--c7:#3c9a2f;--c8:#e07a12;--c9:#d4a106;--c10:#3a55c4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1820;--paper:#13232e;--ink:#e3eef2;--muted:#94adba;--line:#26404d;
    --accent:#3cc59d;--accent-ink:#06261d;--accent-soft:#163a31;--amber:#f2b636;--amber-soft:#3a2e12;
    --stage:#0f1f2a;--good:#4cc47f;--bad:#ff7b6b;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1820;--paper:#13232e;--ink:#e3eef2;--muted:#94adba;--line:#26404d;
  --accent:#3cc59d;--accent-ink:#06261d;--accent-soft:#163a31;--amber:#f2b636;--amber-soft:#3a2e12;
  --stage:#0f1f2a;--good:#4cc47f;--bad:#ff7b6b;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100%}
/* Sidebar */
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--paper);border-right:1px solid var(--line);padding:18px 14px 40px}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);padding:4px 6px 14px}
.brand .logo{width:42px;height:42px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-family:var(--font-display);font-weight:800;font-size:24px;flex:none}
.brand b{font-family:var(--font-display);font-size:19px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12.5px}
.owner{display:grid;gap:1px;margin:0 0 12px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);border-left:4px solid var(--accent);font-size:12.5px;color:var(--muted);line-height:1.4}
.owner b{color:var(--ink);font-size:14px}
.foot{max-width:1100px;padding:18px 0 40px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin:0 clamp(16px,3vw,40px)}
.foot b{color:var(--ink)}
.foot span{font-size:12px}
.byline{display:inline-flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13.5px;color:var(--muted);margin-bottom:10px}
.byline b{color:var(--accent);font-weight:700}
.byline i{font-style:normal;padding:2px 9px;border-radius:20px;background:var(--amber-soft);color:#8a5a00;font-weight:600;font-size:12px}
:root[data-theme="dark"] .byline i{color:var(--amber)}
.goalcard{margin-bottom:6px}.goalcard ul{margin:6px 0 0;padding-left:20px;color:var(--muted);font-size:14.5px}
.opener{margin:14px 0 4px;padding:12px 16px;border-radius:14px;background:var(--amber-soft);font-size:15px}
.sec{margin-top:30px;display:grid;gap:14px}
.sec>h2{display:flex;align-items:center;gap:12px;font-size:clamp(22px,2.6vw,28px);font-weight:800;color:var(--accent)}
.sec>h2 .rn{flex:none;width:40px;height:40px;border-radius:50%;border:3px solid var(--accent);display:grid;place-items:center;font-size:20px}
.sec.know>h2{color:#3c9a2f}
.sec.stem>h2{color:#c2417a}.sec.stem>h2 .rn{border-color:#c2417a}.sec.stem .secbody{max-width:none}
.stemlink{display:block;margin-top:16px;text-decoration:none;color:var(--ink);border-left:5px solid #c2417a}.stemlink b{color:#c2417a}
.secbody{max-width:75ch;font-size:15.5px}
.secbody p{margin:0 0 8px}
.secbody table{border-collapse:collapse;width:100%;font-size:14.5px;margin:6px 0;background:var(--paper);border-radius:12px;overflow:hidden}
.secbody th,.secbody td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.secbody th{background:var(--accent-soft);font-weight:700}
.tablewrap{overflow-x:auto}
.sub{display:grid;gap:12px;padding-left:clamp(0px,2vw,18px);border-left:3px solid var(--line)}
.sub>h3{font-size:20px;font-weight:700}
.qbox{display:flex;gap:12px;align-items:flex-start;background:var(--amber-soft);border-radius:14px;padding:12px 16px;font-size:15px}
.qbox>span{flex:none;width:30px;height:30px;border-radius:8px;background:#f2c94c;color:#10283a;font-weight:800;display:grid;place-items:center;font-family:var(--font-display);font-size:20px}
.learned{border:2px solid var(--accent)}
.learned .can{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--amber-soft);font-size:14.5px}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:10px}
.prog{font-size:12.5px;color:var(--muted);padding:0 6px 10px}
.prog .bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:5px}
.prog .bar i{display:block;height:100%;background:var(--accent);width:0}
.chap{border-top:1px solid var(--line)}
.chap>button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:flex-start;width:100%;padding:10px 6px;font-weight:600;font-size:14px;line-height:1.3}
.chap>button:focus-visible{outline:3px solid var(--amber)}
.chap .num{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;background:var(--cc)}
.chap ul{list-style:none;margin:0 0 8px;padding:0 0 0 8px;display:none}
.chap.open ul{display:block}
.chap li a{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:13.5px;line-height:1.35}
.chap li a:hover{background:var(--bg)}
.chap li a.cur{background:var(--accent-soft);color:var(--ink);font-weight:600}
.chap li a .n{flex:none;color:var(--muted);font-variant-numeric:tabular-nums;width:22px;font-size:12px}
.chap li a .k{margin-left:auto;flex:none;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:1px 6px;border-radius:6px;background:var(--bg);color:var(--muted)}
.chap li a .k.d3{background:var(--amber-soft);color:#8a5a00}
:root[data-theme="dark"] .chap li a .k.d3{color:var(--amber)}
.chap li a.done .n::after{content:"✓";color:var(--good);margin-left:2px}
.menuBtn{display:none}
/* Main */
.main{padding:26px clamp(16px,3vw,40px) 60px;max-width:1180px;width:100%}
.crumb{font-size:13.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.crumb .pill{color:#fff;background:var(--cc);padding:2px 9px;border-radius:20px;font-weight:600;font-size:12px}
.ltitle{font-size:clamp(26px,3.4vw,38px);font-weight:800;margin-bottom:4px}
.lmeta{color:var(--muted);font-size:14px;margin-bottom:18px}
/* Lab bench */
.bench{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.bench-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--accent-soft);color:var(--accent);letter-spacing:.02em}
.tag.d3{background:var(--amber-soft);color:#8a5a00}
:root[data-theme="dark"] .tag.d3{color:var(--amber)}
.bench-h h2{font-size:21px;font-weight:700}
.bench-h .tools{margin-left:auto;display:flex;gap:6px}
.stage{position:relative;background:var(--stage);touch-action:none}
.stage.dark{background:radial-gradient(ellipse at 50% 30%,#18324a 0%,#0b1824 70%)}
.stage canvas{display:block;width:100%;height:auto;cursor:grab}
.stage canvas.pt{cursor:pointer}
.stage .hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:#9fb8c6;background:rgba(8,20,30,.55);padding:3px 9px;border-radius:8px;pointer-events:none}
.stage:not(.dark) .hint{color:var(--muted);background:rgba(255,255,255,.75)}
.ctrls{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.ctrl{display:flex;flex-direction:column;gap:3px;min-width:170px;flex:1 1 170px;max-width:300px}
.ctrl label{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.ctrl label output{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--paper);padding:7px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:7px 12px;cursor:pointer;font-size:13.5px;font-weight:600;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.readouts{display:flex;flex-wrap:wrap;gap:10px;padding:0 18px 14px}
.ro{background:var(--bg);border-radius:10px;padding:6px 12px;min-width:120px}
.ro small{display:block;font-size:11.5px;color:var(--muted)}
.ro b{font-variant-numeric:tabular-nums;font-size:17px}
.guide{padding:12px 18px 16px;border-top:1px dashed var(--line);font-size:14.5px;display:grid;gap:6px}
.guide b{font-family:var(--font-display);font-size:16px}
.guide .ask{background:var(--amber-soft);border-radius:10px;padding:8px 12px}
.info{margin:0 18px 14px;padding:10px 14px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;font-size:14.5px}
.info:empty{display:none}
/* Content grid */
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;margin-top:22px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.card h3{font-size:20px;margin-bottom:8px}
.card ul{margin:0;padding-left:20px;display:grid;gap:6px}
.goals{font-size:14.5px;color:var(--muted);margin-bottom:12px}
.goals ul{gap:3px}
.quiz .q{padding:12px 0;border-top:1px solid var(--line)}
.quiz .q:first-of-type{border-top:0;padding-top:0}
.quiz .q p{margin:0 0 8px;font-weight:600}
.quiz .opts{display:grid;gap:6px}
.quiz .opts button{text-align:left;border:1px solid var(--line);background:var(--bg);padding:8px 12px;border-radius:10px;cursor:pointer;font-size:14.5px}
.quiz .opts button:hover:not(:disabled){border-color:var(--accent)}
.quiz .opts button.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--paper))}
.quiz .opts button.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--paper))}
.quiz .why{font-size:14px;color:var(--muted);margin-top:6px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
.pager a{flex:1;max-width:48%;text-decoration:none;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px;color:var(--ink)}
.pager a small{display:block;color:var(--muted);font-size:12.5px}
.pager a.next{text-align:right;margin-left:auto}
/* Home */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:center;margin-bottom:26px}
.hero h1{font-size:clamp(30px,4.2vw,46px);font-weight:800}
.hero p{color:var(--muted);max-width:60ch}
.hero .stage{border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stats div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.stats b{font-family:var(--font-display);font-size:24px;display:block;line-height:1}
.stats small{color:var(--muted);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ccard{background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--cc);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.ccard:hover{box-shadow:var(--shadow)}
.ccard small{color:var(--muted);font-weight:600;font-size:12.5px}
.ccard b{font-family:var(--font-display);font-size:18px;line-height:1.2}
.ccard .ls{font-size:13px;color:var(--muted)}
.sorter{padding:14px 18px;display:grid;gap:12px}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:22px;padding:6px 12px;cursor:pointer;font-size:14px;font-weight:500}
.chip.sel{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.chip.ok{border-color:var(--good);color:var(--good)}
.chip.no{border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bin{border:2px dashed var(--line);border-radius:14px;padding:8px;min-height:90px;cursor:pointer;background:var(--stage)}
.bin:hover{border-color:var(--accent)}
.bin h4{margin:0 0 6px;font-size:14px}
.bin .in{display:flex;flex-wrap:wrap;gap:5px}
.bin .in span{font-size:12.5px;background:var(--accent-soft);border-radius:12px;padding:2px 8px}
@media (max-width:1000px){.cols{grid-template-columns:1fr}.hero{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(320px,88vw);z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  .side.show{transform:none}
  .menuBtn{display:inline-flex;position:sticky;top:8px;z-index:10;margin:8px 0 0 12px}
  .main{padding-top:10px}
  .ctrl{max-width:none}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Mục lục">
    <a class="brand" href="#trang-chu"><span class="logo">6</span><span><b>Phòng thí nghiệm ảo</b><small>Khoa học tự nhiên 6 · Kết nối tri thức</small></span></a>
    <div class="owner"><b>GV Nguyễn Thuỷ Lưu</b><span>Trường THCS Nguyễn Du</span><span>Tổ KHTN-CN</span></div>
    <input class="search" id="q" type="search" placeholder="Tìm bài học…" aria-label="Tìm bài học">
    <div class="prog" id="prog"></div>
    <nav id="toc"></nav>
  </aside>
  <div>
    <button class="btn menuBtn" id="menuBtn" aria-controls="side">☰ Mục lục</button>
    <main class="main" id="main"></main>
    <footer class="foot"><b>GV Nguyễn Thuỷ Lưu</b> · Trường THCS Nguyễn Du · Tổ KHTN-CN<br><span>Học liệu điện tử Khoa học tự nhiên 6, theo SGK Kết nối tri thức với cuộc sống</span></footer>
  </div>
</div>
<script>
"use strict";
/* ============ Tiện ích chung ============ */
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const k in attrs) {
    const v = attrs[k];
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const fmt = (v, d = 1) => Number(v).toLocaleString("vi-VN", { minimumFractionDigits: d, maximumFractionDigits: d });
const rand = (a, b) => a + Math.random() * (b - a);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function hexRgb(h) {
  if (Array.isArray(h)) return h;
  h = h.replace("#", "");
  if (h.length === 3) h = h.split("").map(c => c + c).join("");
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const rgb = (c, k = 1, a = 1) => `rgba(${clamp(c[0] * k, 0, 255) | 0},${clamp(c[1] * k, 0, 255) | 0},${clamp(c[2] * k, 0, 255) | 0},${a})`;
function isDark() {
  const t = document.documentElement.getAttribute("data-theme");
  if (t) return t === "dark";
  return matchMedia("(prefers-color-scheme: dark)").matches;
}
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

/* ============ Runtime cho mỗi mô phỏng (tự dọn khi đổi bài) ============ */
class Runtime {
  constructor(bench) {
    this.bench = bench;
    this.stageEl = bench.querySelector(".stage");
    this.ctrlEl = bench.querySelector(".ctrls");
    this.roEl = bench.querySelector(".readouts");
    this.infoEl = bench.querySelector(".info");
    this.cbs = []; this.raf = 0; this.listeners = []; this.ros = []; this.alive = true; this.timers = [];
  }
  dispose() {
    this.alive = false; cancelAnimationFrame(this.raf);
    this.listeners.forEach(([t, e, f, o]) => t.removeEventListener(e, f, o));
    this.ros.forEach(r => r.disconnect()); this.timers.forEach(clearTimeout);
  }
  on(t, e, f, o) { t.addEventListener(e, f, o); this.listeners.push([t, e, f, o]); }
  later(f, ms) { this.timers.push(setTimeout(f, ms)); }
  loop(fn) {
    this.cbs.push(fn);
    if (this.cbs.length === 1) {
      let last = performance.now();
      const tick = now => {
        if (!this.alive) return;
        const dt = Math.min(0.05, (now - last) / 1000); last = now;
        for (const f of this.cbs) f(dt, now / 1000);
        this.raf = requestAnimationFrame(tick);
      };
      this.raf = requestAnimationFrame(tick);
    }
  }
  dark(on = true) { this.stageEl.classList.toggle("dark", on); }
  hint(t) { this.stageEl.append(el("div", { class: "hint" }, t)); }
  /* Canvas có toạ độ logic W×H, tự co giãn theo khung */
  canvas(W = 800, H = 450) {

/* Mô hình 3D có danh sách bộ phận để bấm chọn: parts = [{name, desc, objs:[...] , at:{x,y,z}}] */
function partsPanel(rt, sc, parts, intro) {
  const host = el("div", { class: "seg", role: "group", "aria-label": "Bộ phận" });
  const labels = parts.map(p => sc.label(p.name, p.at, p.lab || {}));
  const btns = parts.map((p, i) => {
    const b = el("button", { type: "button", "aria-pressed": "false" }, p.name);
    rt.on(b, "click", () => choose(i)); return b;
  });
  host.append(...btns); rt.ctrlEl.append(host);
  function choose(i) {
    parts.forEach((p, j) => { const on = i === j; (p.objs || []).forEach(o => o.hl = on); labels[j].sel = on; btns[j].setAttribute("aria-pressed", String(on)); });
    if (i >= 0) rt.info(`<b>${parts[i].name}:</b> ${parts[i].desc}`);
  }
  sc.onPick = o => { const i = parts.findIndex(p => (p.objs || []).includes(o)); if (i >= 0) choose(i); };
  parts.forEach(p => (p.objs || []).forEach(o => o.pickable = true));
  if (intro) rt.info(intro);
  rt.toggle("Chú thích", true, v => sc.showLabels = v);
  rt.button("Đặt lại góc nhìn", () => sc.reset());
  return { choose };
}

/* Bộ phân loại kéo-thả (bấm thẻ rồi bấm ô) */
function sorter(rt, bins, items, done) {
  rt.stageEl.style.touchAction = "auto";
  if (!Array.isArray(bins[0]) && typeof bins[0] === "object") { // nhiều phần
    const parts = bins; let host = null;
    const show = i => { if (host) host.remove(); const sub = Object.create(rt); sub.readout = () => () => {}; sub.button = () => {}; sub.stageEl = el("div"); rt.stageEl.append(sub.stageEl); host = sub.stageEl; sorter(sub, parts[i].bins, parts[i].items, parts[i].done); };
    rt.seg(parts.map(p => p.name), 0, i => show(i));
    rt.button("Làm lại", () => App.reloadSim());
    show(0); return;
  }
  const wrap = el("div", { class: "sorter" });
  const pool = el("div", { class: "pool" });
  const binEls = bins.map((b, i) => { const inn = el("div", { class: "in" }); const d = el("div", { class: "bin", role: "button", tabindex: "0" }, el("h4", {}, b), inn); d._in = inn; d._i = i; return d; });
  let sel = null, ok = 0;
  const shuffled = items.map((it, i) => [Math.random(), it]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  shuffled.forEach(it => {
    const c = el("button", { class: "chip", type: "button" }, it[0]); c._bin = it[1]; c._why = it[2];
    rt.on(c, "click", () => { if (sel) sel.classList.remove("sel"); sel = c; c.classList.add("sel"); });
    pool.append(c);
  });
  const scoreEl = el("div", { style: "font-size:13px;color:var(--muted)" }, `Đã xếp đúng 0/${items.length}`);
  const score = v => scoreEl.textContent = "Đã xếp đúng " + v;
  binEls.forEach(d => {
    const drop = () => {
      if (!sel) { rt.info("Chọn một thẻ trước, rồi bấm vào ô phù hợp."); return; }
      const good = Array.isArray(sel._bin) ? sel._bin.includes(d._i) : sel._bin === d._i;
      if (good) {
        d._in.append(el("span", {}, sel.textContent)); sel.remove(); ok++; score(`${ok}/${items.length}`);
        rt.info(sel._why ? `<b>Đúng.</b> ${sel._why}` : "<b>Đúng.</b>"); sel = null;
        if (ok === items.length) { rt.info("<b>Hoàn thành!</b> " + (done || "Em đã phân loại đúng tất cả.")); }
      } else { const s = sel; s.classList.remove("no"); void s.offsetWidth; s.classList.add("no"); rt.info(`Chưa đúng: <b>${s.textContent}</b> không thuộc “${bins[d._i]}”. Thử lại nhé.`); }
    };
    rt.on(d, "click", drop); rt.on(d, "keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); drop(); } });
  });
  wrap.append(scoreEl, pool, el("div", { class: "bins" }, binEls));
  rt.stageEl.append(wrap);
  rt.button("Làm lại", () => { App.reloadSim(); });
}

function txt(ctx, s, x, y, o = {}) {

  ctx.fillText(s, x, y); ctx.textAlign = "left";
}
function arrow(ctx, x1, y1, x2, y2, color, w = 3, head = 10) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  ctx.strokeStyle = ctx.fillStyle = color; ctx.lineWidth = w; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - Math.cos(a) * head * .6, y2 - Math.sin(a) * head * .6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - head * Math.cos(a - .45), y2 - head * Math.sin(a - .45)); ctx.lineTo(x2 - head * Math.cos(a + .45), y2 - head * Math.sin(a + .45)); ctx.closePath(); ctx.fill();
}

 { n: 8, t: "Đo nhiệt độ", p: 24, kind: "tn", sim: "thermo",

   simTitle: "Đun nóng nước và đọc nhiệt kế",

{ roman: "II", t: "Chất quanh ta", lessons: [

 { n: 10, t: "Các thể của chất và sự chuyển thể", p: 30, kind: "tn",
   goals: ["Trình bày được đặc điểm cơ bản của ba thể rắn, lỏng, khí.", "Nêu được khái niệm sự nóng chảy, sự đông đặc và trình bày được quá trình diễn ra hai sự chuyển thể này; nêu được khái niệm sôi, bay hơi, ngưng tụ.", "Tiến hành được thí nghiệm về sự chuyển thể của chất: ghi nhiệt độ của sáp theo thời gian khi đun nóng và khi để nguội (dự án STEM “Vụn sáp hồi sinh”).", "Kiểm chứng được thông tin do AI cung cấp bằng SGK, mô phỏng và số liệu thực nghiệm."],
   intro: "<b>Khởi động – Hành trình của cây bút sáp cụt:</b> Hộp bút sáp màu của em còn nhiều cây gãy, cụt bị vứt bỏ. Làm thế nào để biến chúng thành một sản phẩm mới? Trong bài này, em học về các thể của chất và sự chuyển thể, rồi cùng nhóm thực hiện dự án STEM <b>“Vụn sáp hồi sinh”</b>: thu gom vụn sáp, đun cách thuỷ, đo nhiệt độ theo thời gian, đổ khuôn và tạo một trong bốn sản phẩm (bút sáp màu, giỏ hoa sáp, tranh phối hoa sáp, nến từ sáp).",
   sections: [
    { no: "I", h: "Các thể của chất",
      body: "<p>Chất tồn tại ở ba thể cơ bản: <b>rắn</b>, <b>lỏng</b>, <b>khí</b>. Ở nhiệt độ phòng, sáp bút màu ở thể rắn, nước ở thể lỏng, không khí ở thể khí.</p><div class='tablewrap'><table><thead><tr><th>Thể</th><th>Sự sắp xếp và chuyển động của hạt</th><th>Hình dạng, thể tích</th><th>Khả năng bị nén</th></tr></thead><tbody><tr><td><b>Rắn</b> (solid)</td><td>Hạt xếp khít nhau, chỉ dao động tại chỗ</td><td>Có hình dạng và thể tích xác định</td><td>Rất khó nén</td></tr><tr><td><b>Lỏng</b> (liquid)</td><td>Hạt gần nhau, trượt lên nhau</td><td>Có thể tích xác định, hình dạng theo vật chứa</td><td>Khó nén</td></tr><tr><td><b>Khí</b> (gas)</td><td>Hạt rất xa nhau, chuyển động hỗn loạn</td><td>Không có hình dạng và thể tích xác định</td><td>Dễ nén</td></tr></tbody></table></div>",
      sim: "states", kind: "tn", simTitle: "Hạt chất ở thể rắn, lỏng, khí khi đun nóng",
      how: "<b>Dùng cho HĐ2 (ở nhà).</b> Bấm <b>Đun nóng</b> cho nước đá (bắt đầu ở −20 °C, dưới 0 °C). Quan sát mô hình hạt, các ô <b>Nhiệt độ</b>, <b>Thể của nước</b>, <b>Quá trình</b> và đồ thị nhiệt độ theo thời gian. Sau đó bấm <b>Làm lạnh</b> để quan sát sự đông đặc. Chụp màn hình đồ thị đăng lên Padlet và ghi vào nhật kí kiểm chứng: nhiệt độ của nước đá trong lúc đang nóng chảy, và dự đoán đồ thị của sáp có giống đồ thị của nước đá không.",
      q: "<b>Phiếu học tập 1 – câu 6:</b> Trong khi nước đá đang nóng chảy, nhiệt độ có thay đổi không? Các hạt chuyển động thế nào khi chất chuyển từ thể rắn sang thể lỏng?" },
    { no: "II", h: "Sự nóng chảy và sự đông đặc",
      sub: [
        { h: "1. Khái niệm",
          body: "<p><b>Sự nóng chảy</b> (melting) là quá trình chất chuyển từ <b>thể rắn sang thể lỏng</b>. Ví dụ: vụn sáp nhận nhiệt khi đun cách thuỷ, chảy thành sáp lỏng.</p><p><b>Sự đông đặc</b> (solidifying) là quá trình chất chuyển từ <b>thể lỏng sang thể rắn</b>. Ví dụ: sáp lỏng rót vào khuôn, toả nhiệt khi nguội và đông đặc thành bút sáp, hoa sáp, nến.</p><p>Chất <b>tinh khiết</b> như nước đá nóng chảy (và đông đặc) ở <b>một nhiệt độ xác định</b>: nước đá nóng chảy ở 0 °C, trong suốt thời gian nóng chảy nhiệt độ không đổi. Bút sáp màu là <b>hỗn hợp</b> (sáp, chất màu, phụ gia) nên nóng chảy trong <b>một khoảng nhiệt độ</b>, nhiệt độ vẫn tăng chậm trong lúc sáp đang chảy.</p>",
          sim: "meltCompare", kind: "tn", simTitle: "So sánh đồ thị nóng chảy, đông đặc: nước đá và sáp bút màu",
          how: "<b>Dùng cho HĐ4 (bước 10) và câu nâng cao số 5 ở Phụ lục 3.</b> Bấm <b>Đun nóng</b> để đun nước đá và sáp cùng lúc; bấm <b>Làm lạnh</b> để xem sự đông đặc. Bật hoặc tắt <b>Đánh dấu đoạn chuyển thể</b> để so sánh hai đường. Số liệu của sáp là ước lượng minh hoạ; nhóm dùng số đo thật của mình để kết luận.",
          q: "So sánh đồ thị nhiệt độ của sáp với đồ thị của nước đá. Em thấy điểm giống và khác nhau nào? Vì sao có sự khác nhau đó?" },
        { h: "2. Dự án STEM “Vụn sáp hồi sinh”",
          body: "<p>Tiến trình theo <b>quy trình thiết kế kĩ thuật</b>: HĐ0–HĐ2 ở nhà, HĐ3–HĐ5 tại lớp (2 tiết). Mỗi nhóm chọn một sản phẩm; cả lớp dùng chung quy trình đun cách thuỷ và đo nhiệt độ nên có số liệu chung để so sánh.</p><div class='tablewrap'><table><thead><tr><th>Hoạt động</th><th>Em làm gì</th><th>Trên web</th></tr></thead><tbody><tr><td>HĐ0 · Khởi động (ở nhà)</td><td>Thu gom vụn sáp, khảo sát bút sáp gãy, cụt</td><td>–</td></tr><tr><td>HĐ1 · Xác định vấn đề (ở nhà)</td><td>Thảo luận trên Padlet, nêu vấn đề và tiêu chí sản phẩm</td><td>–</td></tr><tr><td>HĐ2 · Nghiên cứu kiến thức nền (ở nhà)</td><td>Đọc SGK, làm Phiếu học tập 1, ghi nhật kí kiểm chứng AI, sửa bản hướng dẫn có lỗi</td><td>Thí nghiệm ở mục I; mô phỏng tìm 5 lỗi</td></tr><tr><td>HĐ3 · Lựa chọn giải pháp (15 phút)</td><td>Chọn sản phẩm, vẽ bản thiết kế, hoàn thiện bản thuyết minh</td><td>Chạy thử mô phỏng tái chế</td></tr><tr><td>HĐ4 · Chế tạo, thử nghiệm (45 phút)</td><td>Đun cách thuỷ, ghi nhiệt độ mỗi 30 giây, đổ khuôn, cân sản phẩm, vẽ đồ thị, so sánh với dự đoán của AI</td><td>Mô phỏng tái chế; so sánh với nước đá</td></tr><tr><td>HĐ5 · Chia sẻ, điều chỉnh (25 phút)</td><td>Trình bày sản phẩm và đồ thị, đánh giá đồng đẳng, nêu cách cải tiến</td><td>–</td></tr></tbody></table></div><p><b>An toàn:</b> luôn đun cách thuỷ, cầm becher bằng kẹp gỗ, không đổ sáp xuống bồn rửa, không thắp nến trong lớp. <i>Careful! Hot wax!</i></p>",
          sim: "waxAiErrors", kind: "tn", simTitle: "HĐ2 · Tìm 5 lỗi trong bản hướng dẫn tái chế do AI soạn",
          how: "Đọc 10 bước trong bản hướng dẫn. Bấm vào bước em cho là <b>sai</b> để xem lí do và cách sửa. Ghi các lỗi vào nhật kí kiểm chứng AI và sửa thành bản thuyết minh quy trình của nhóm.",
          ask: "Vì sao không được tin ngay hướng dẫn do AI soạn? Em kiểm chứng bằng những nguồn nào?",
          extra: [{ sim: "waxStem", kind: "tn", simTitle: "HĐ3–HĐ4 · Tái chế vụn bút sáp: đun cách thuỷ, đo nhiệt độ, đổ khuôn",
            how: "1. Chọn sản phẩm, cách đun, hai màu sáp và khối lượng mỗi màu (khoảng 20 g). 2. Bấm <b>Bắt đầu đun</b>: nhiệt độ tự ghi mỗi 30 giây vào bảng và đồ thị. 3. Khi sáp chảy lỏng hoàn toàn, bấm <b>Rót vào khuôn</b>. 4. Chọn để nguội ở nhiệt độ phòng hoặc ngăn mát, chờ sáp <b>đông đặc hoàn toàn</b> rồi bấm <b>Lấy sản phẩm ra khỏi khuôn</b>. 5. Đọc tỉ lệ tái chế, bấm <b>Sao chép số liệu</b> để dán vào bảng tính, rồi đánh giá dự đoán của AI (dự đoán trên đồ thị là ví dụ; nhóm dùng dự đoán thật GV đã đăng trên Padlet). Thử cả cách làm sai (đun trực tiếp, rót sớm, lấy ra sớm) để thấy hậu quả.",

          q: "Phiếu học tập 1: Khi đun, sáp chuyển từ thể nào sang thể nào? Khi để nguội thì ngược lại ra sao?" },
        { h: "3. Science words – Từ vựng khoa học",

    { no: "III", h: "Sự bay hơi, sự sôi và sự ngưng tụ",
      body: "<p><b>Sự bay hơi</b> là quá trình chất chuyển từ thể lỏng sang thể hơi, xảy ra ở <b>bề mặt</b> chất lỏng. <b>Sự ngưng tụ</b> là quá trình ngược lại: hơi chuyển thành lỏng (hơi nước đọng thành giọt trên nắp nồi).</p><p><b>Sự sôi</b> là sự bay hơi xảy ra cả <b>trong lòng và trên bề mặt</b> chất lỏng. Nước sôi ở 100 °C; trong khi sôi, nhiệt độ không đổi. Em có thể quan sát lại trên thí nghiệm ở mục I: tiếp tục <b>Đun nóng</b> sau khi nước đá tan hết.</p>",
      q: "Vì sao không nên đun sáp quá nóng đến mức bốc khói? (Gợi ý: hơi sáp nóng dễ bắt lửa, gây nguy hiểm.)" }
   ],
   know: { body: "<p><b>Từ vụn sáp đến sản phẩm mới:</b> Sáp và nhiều chất dẻo, kim loại có thể nóng chảy rồi đông đặc lại nhiều lần mà vẫn là chất đó. Nhờ vậy con người tái chế được vụn nến, vụn sáp, nhựa, kim loại phế liệu và đúc thành vật dụng mới. Một số ứng dụng khác của sự nóng chảy và đông đặc: đúc vật dụng kim loại, làm kem, làm thạch, làm đá viên.</p>" },
   points: ["<b>Thể rắn</b>: hạt xếp khít, chỉ dao động tại chỗ; có hình dạng và thể tích xác định, rất khó nén. <b>Thể lỏng</b>: hạt trượt lên nhau; có thể tích xác định, hình dạng theo vật chứa. <b>Thể khí</b>: hạt rất xa nhau, chuyển động hỗn loạn, dễ nén.",
     "<b>Sự nóng chảy</b>: rắn → lỏng (chất nhận nhiệt). <b>Sự đông đặc</b>: lỏng → rắn (chất toả nhiệt).",
     "Chất tinh khiết (nước đá) nóng chảy ở một nhiệt độ xác định (0 °C), nhiệt độ không đổi trong khi nóng chảy; hỗn hợp (sáp bút màu) nóng chảy trong một khoảng nhiệt độ.",
     "<b>Bay hơi</b> (lỏng → hơi, ở bề mặt), <b>sôi</b> (bay hơi cả trong lòng và bề mặt chất lỏng, nước sôi ở 100 °C), <b>ngưng tụ</b> (hơi → lỏng).",
     "Tái chế vụn sáp dựa trên sự nóng chảy và đông đặc: đun cách thuỷ, đo nhiệt độ theo thời gian, đổ khuôn, để nguội hẳn rồi mới lấy sản phẩm ra."],
   can: "Giải thích quy trình tái chế bút sáp bằng kiến thức nóng chảy, đông đặc và kiểm chứng thông tin do AI cung cấp bằng số liệu thực nghiệm.",
   quiz: [["Chất nào dễ bị nén nhất?", ["Sắt", "Nước", "Không khí", "Gỗ"], 2, "Chất khí có các hạt ở xa nhau nên dễ nén."],
     ["Khi đun cách thuỷ, vụn sáp chảy thành sáp lỏng. Đó là sự", ["Đông đặc", "Nóng chảy", "Ngưng tụ", "Bay hơi"], 1, "Sáp chuyển từ thể rắn sang thể lỏng: sự nóng chảy."],
     ["Sáp lỏng rót vào khuôn, để nguội thành bút sáp. Đó là sự", ["Nóng chảy", "Bay hơi", "Đông đặc", "Sôi"], 2, "Sáp chuyển từ thể lỏng sang thể rắn: sự đông đặc."],
     ["Vì sao phải đun sáp cách thuỷ mà không đun trực tiếp trên lửa?", ["Để sáp đổi màu", "Để sáp nóng đều, không quá nóng, tránh bốc khói, bắt lửa", "Để sáp nhanh đông đặc", "Để tiết kiệm sáp"], 1, "Đun cách thuỷ giữ sáp không nóng quá nhiệt độ của nước, an toàn hơn."],
     ["Trong khi nước đá đang nóng chảy, nhiệt độ của nó", ["Tăng nhanh", "Giảm dần", "Không đổi (0 °C)", "Tăng rồi giảm"], 2, "Nước đá là chất tinh khiết, nóng chảy ở 0 °C và nhiệt độ không đổi cho đến khi tan hết."],
     ["AI nói: “Bút sáp nóng chảy ở đúng 60 °C và nhiệt độ không đổi khi nóng chảy.” Theo số liệu thí nghiệm, nhận định này", ["Đúng hoàn toàn", "Chưa đủ chính xác: sáp là hỗn hợp nên nóng chảy trong một khoảng nhiệt độ", "Sai hoàn toàn: sáp không nóng chảy", "Không thể kiểm chứng"], 1, "Phải kiểm chứng AI bằng thực nghiệm: sáp bút màu nóng chảy trong một khoảng nhiệt độ."],
     ["Hơi nước đọng thành giọt trên nắp nồi là sự", ["Bay hơi", "Ngưng tụ", "Nóng chảy", "Đông đặc"], 1, "Hơi nước gặp lạnh chuyển thành thể lỏng: ngưng tụ."]] },

{ roman: "V", t: "Tế bào", lessons: [
 { n: 18, t: "Tế bào – Đơn vị cơ bản của sự sống", p: 64, kind: "3d",
   goals: ["Nêu được khái niệm, chức năng của tế bào.", "Nhận biết được tế bào là đơn vị cấu trúc của sự sống.", "Nêu được hình dạng và kích thước của một số loại tế bào."],
   intro: "<b>Khởi động:</b> Một ngôi nhà được xây nên từ rất nhiều viên gạch. Vậy các sinh vật quanh ta (cây cối, con vật, chính chúng ta) được xây nên từ những “viên gạch” nào?",
   sections: [
    { no: "I", h: "Tế bào là gì?",
      body: "<p>Mọi cơ thể sinh vật (thực vật, động vật, con người…) đều được cấu tạo từ những đơn vị rất nhỏ gọi là <b>tế bào</b>, giống như ngôi nhà được xây từ các viên gạch.</p><p>Tế bào tuy nhỏ nhưng tự thực hiện được đầy đủ các quá trình sống cơ bản: <b>sinh trưởng</b> (lớn lên), <b>hấp thụ chất dinh dưỡng</b>, <b>hô hấp</b>, <b>cảm ứng</b>, <b>bài tiết</b> và <b>sinh sản</b>. Vì vậy tế bào là <b>đơn vị cấu trúc và chức năng</b> cơ bản của cơ thể sống.</p>",
      sim: "cellIntro", kind: "tn", simTitle: "Phóng to để thấy “viên gạch” của sự sống",
      how: "Chọn một đối tượng rồi kéo thanh <b>Phóng to</b>. Quan sát: bức tường được xây từ các viên gạch; lá cây, da người được cấu tạo từ rất nhiều tế bào; vi khuẩn chỉ gồm một tế bào. Bấm các nút quá trình sống để xem tế bào thực hiện chúng.",
      q: "Tại sao tế bào được coi là đơn vị cơ bản của cơ thể sống?" },
    { no: "II", h: "Hình dạng và kích thước tế bào",
      sub: [
        { h: "1. Hình dạng tế bào",
          body: "<p>Có rất nhiều loại tế bào. <b>Hình dạng của mỗi loại tế bào thường phù hợp với chức năng của nó.</b></p><div class='tablewrap'><table><thead><tr><th>Loại tế bào</th><th>Hình dạng</th><th>Phù hợp với chức năng</th></tr></thead><tbody><tr><td>Tế bào da ở người</td><td>Dẹt, nhiều cạnh, xếp sát nhau thành lớp</td><td>Che chở, bảo vệ cơ thể</td></tr><tr><td>Tế bào thần kinh ở người</td><td>Có nhiều sợi nhánh và một sợi trục dài</td><td>Nhận và dẫn truyền thông tin đi xa</td></tr><tr><td>Tế bào vi khuẩn</td><td>Hình que (một số hình cầu, xoắn, phẩy)</td><td>Cơ thể đơn bào, sống ở nhiều môi trường</td></tr><tr><td>Tế bào ở lá cây</td><td>Hình hộp, hình trụ, xếp sát nhau, nhiều lục lạp</td><td>Quang hợp</td></tr><tr><td>Hồng cầu</td><td>Hình đĩa lõm hai mặt</td><td>Vận chuyển oxygen, dễ đi qua mạch máu nhỏ</td></tr><tr><td>Tế bào cơ</td><td>Hình thoi, sợi dài</td><td>Co rút giúp cơ thể vận động</td></tr></tbody></table></div>",
          sim: "cellShapes3d", kind: "3d", simTitle: "Hình dạng một số loại tế bào (mô hình 3D)",
          how: "Chọn từng loại tế bào để xem mô hình 3D. Kéo để xoay, cuộn để phóng to. Bấm vào tế bào để đọc hình dạng và chức năng.",
          q: "Quan sát các mô hình, em có nhận xét gì về hình dạng tế bào?" },
        { h: "2. Kích thước tế bào",
          body: "<p>Kích thước tế bào <b>khác nhau</b> giữa các nhóm sinh vật và giữa các cơ quan trong một cơ thể.</p><p>Chỉ có <b>rất ít tế bào</b> đủ lớn để nhìn thấy bằng mắt thường (trứng cá, tép bưởi, lòng đỏ trứng chim). <b>Hầu hết tế bào rất nhỏ</b>, phải dùng <b>kính hiển vi</b> mới quan sát được. Kích thước tế bào thường đo bằng <b>micromet</b> (1 µm = 1/1000 mm).</p>",
          sim: "sizeLadder", kind: "tn", simTitle: "Hình 18.2. Kích thước các bậc cấu trúc của thế giới sống",
          how: "Thang đo chia theo bậc 10: mỗi vạch lớn gấp 10 lần vạch bên trái, từ 0,1 nm đến 1 km. <b>Bấm vào từng hình</b> để xem kích thước và dụng cụ quan sát. <b>Bấm vào dải màu</b> (mắt thường, kính hiển vi quang học, kính hiển vi điện tử) để làm nổi bật những gì quan sát được bằng dụng cụ đó. Chọn <b>Thử thách</b> để tự kéo các hình vào đúng vị trí trên thang.",
          extra: [{ sim: "cellsize", kind: "tn", simTitle: "Phóng to dần để so sánh kích thước", how: "Kéo thanh <b>Phóng to</b> để thu hẹp dần khung nhìn từ 20 cm xuống 0,2 µm và quan sát các tế bào xuất hiện." }],
          q: "Tế bào vi khuẩn, tế bào động vật và thực vật: tế bào nào phải quan sát bằng kính hiển vi, tế bào nào có thể quan sát bằng mắt thường?" }
      ] }
   ],
   know: { body: "<p><b>Tế bào đầu tiên được nhìn thấy như thế nào?</b> Năm 1665, nhà khoa học người Anh Rô-bớt Húc (Robert Hooke) dùng kính hiển vi tự chế quan sát một lát mỏng vỏ cây bần. Ông thấy nhiều ô nhỏ giống những chiếc hộp và đặt tên là “tế bào”.</p><p><b>Tại sao hầu hết tế bào rất nhỏ?</b> Oxygen, chất dinh dưỡng đi vào và chất thải đi ra đều phải qua <b>bề mặt</b> tế bào. Khi tế bào lớn lên, <b>thể tích tăng nhanh hơn nhiều so với diện tích bề mặt</b>, nên bề mặt không cung cấp đủ cho nhu cầu bên trong. Thử ngay với mô phỏng dưới đây.</p>",
     sim: "surfaceVolume", kind: "tn", simTitle: "Diện tích bề mặt và thể tích (tỉ lệ S/V)",
     how: "Kéo thanh <b>Cạnh tế bào</b> để tế bào hình lập phương lớn dần. So sánh diện tích bề mặt S, thể tích V và tỉ lệ S/V." },
   points: ["Mọi cơ thể sống đều được cấu tạo từ tế bào, vì vậy tế bào được xem là “<b>đơn vị cơ bản của sự sống</b>”.", "Các loại tế bào <b>khác nhau về hình dạng và kích thước</b>; hình dạng phù hợp với chức năng.", "Hầu hết tế bào rất nhỏ, phải quan sát bằng kính hiển vi; một số ít tế bào lớn nhìn được bằng mắt thường."],
   can: "Giải thích được vì sao mỗi loại tế bào lại có hình dạng khác nhau.",
   quiz: [["Đơn vị cấu trúc và chức năng của cơ thể sống là", ["Mô", "Cơ quan", "Tế bào", "Hệ cơ quan"], 2, "Tế bào là đơn vị cơ bản của sự sống."],
     ["Tế bào nào có thể quan sát bằng mắt thường?", ["Vi khuẩn", "Hồng cầu", "Tép bưởi", "Tế bào niêm mạc miệng"], 2, "Tép bưởi là tế bào lớn, nhìn thấy được bằng mắt thường."],
     ["Bốn bạn thảo luận về tế bào. Phát biểu nào đúng?", ["Tất cả tế bào có cùng hình dạng nhưng khác kích thước", "Tất cả tế bào có hình dạng và kích thước giống nhau", "Tất cả tế bào có cùng kích thước nhưng hình dạng luôn khác nhau", "Các loại tế bào khác nhau thường có kích thước và hình dạng khác nhau"], 3, "Ví dụ: tế bào thần kinh có sợi trục dài, hồng cầu hình đĩa nhỏ khoảng 7 µm, còn trứng cá to hơn 1 mm."],
     ["Tế bào thần kinh có nhiều sợi nhánh và sợi trục dài vì", ["Để trang trí", "Phù hợp với chức năng nhận và dẫn truyền thông tin", "Để bảo vệ cơ thể", "Để chứa nhiều lục lạp"], 1, "Hình dạng tế bào phù hợp với chức năng của nó."]] },

 { n: 21, t: "Thực hành: Quan sát và phân biệt một số loại tế bào", p: 73, kind: "tn", sim: "scopeCells",

  o.font = "3px sans-serif"; o.fillText("Em có nhìn thấy dòng chữ này không?", 60, 40);

    state = { m, blur, inv };
    roM(inv ? "ảnh ngược, mờ" : "× " + fmt(m, 1)); roS(blur < 1.2 ? "Rõ nét" : blur < 3.5 ? "Hơi mờ" : "Rất mờ");
    rt.info(inv ? "Kính đặt <b>quá xa</b> vật (xa hơn tiêu cự): ảnh bị lộn ngược và mờ. Hãy đưa kính lại gần vật." : blur < 1.2 ? "Ảnh <b>rõ nét</b> và phóng to. Đây là khoảng cách thích hợp." : "Từ từ thay đổi khoảng cách giữa kính và vật để ảnh rõ nét hơn.");
  }

  rt.on(c.cv, "pointerdown", e => { const p = c.pt(e); mx = p.x; my = p.y; });

    const src = R / m, q = Math.max(1, blur);

    sc.save();
    if (inv) { sc.translate(small.width / 2, small.height / 2); sc.rotate(Math.PI); sc.translate(-small.width / 2, -small.height / 2); }
    sc.drawImage(off, (mx - src) * 2, (my - src) * 2, src * 4, src * 4, 0, 0, small.width, small.height); sc.restore();

    ctx.fillStyle = g; ctx.fillRect(mx - R, my - R, 2 * R, 2 * R); ctx.restore();
    ctx.lineWidth = 10; ctx.strokeStyle = "#2a2f36"; ctx.beginPath(); ctx.arc(mx, my, R + 5, 0, TAU); ctx.stroke();
    ctx.lineWidth = 2; ctx.strokeStyle = "#8a96a3"; ctx.beginPath(); ctx.arc(mx, my, R + 1, 0, TAU); ctx.stroke();
    ctx.save(); ctx.translate(mx, my); ctx.rotate(0.75); ctx.fillStyle = "#2a2f36"; roundRect(ctx, R + 8, -11, 120, 22, 8); ctx.fill(); ctx.fillStyle = "#c9a227"; ctx.fillRect(R + 8, -11, 14, 22); ctx.restore();
  });
};

/* Đo chiều dài */
SIMS.ruler = rt => {
  const c = rt.canvas(800, 330), ctx = c.ctx;
  const PX = 22, X0 = 70, RY = 190;
  let dc = 0.1, eye = 1, L = 0, px = 0, drag = null;
  const newObj = () => { L = Math.round(rand(7, 26) * 10) / 10; px = X0 + rand(30, 90); rt.info("Kéo cây bút chì để đầu bên trái thẳng với vạch số 0, rồi đọc kết quả."); inp.value = ""; };
  rt.seg(["ĐCNN 1 mm", "ĐCNN 0,5 cm", "ĐCNN 1 cm"], 0, i => { dc = [0.1, 0.5, 1][i]; });
  rt.seg(["Mắt lệch trái", "Mắt vuông góc", "Mắt lệch phải"], 1, i => { eye = i; });
  const id = "len" + Math.random().toString(36).slice(2, 6);
  const inp = el("input", { id, type: "number", step: "0.1", min: "0", style: "width:110px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper)" });
  rt.ctrlEl.append(el("div", { class: "ctrl", style: "min-width:140px;flex:0 0 auto" }, el("label", { for: id }, "Kết quả đo (cm)"), inp));
  rt.button("Kiểm tra", () => {
    const v = parseFloat(String(inp.value).replace(",", "."));
    const off = (px - X0) / PX;
    if (isNaN(v)) return rt.info("Hãy nhập kết quả đo (cm).");
    if (Math.abs(off) > 0.08) return rt.info(`Chưa đúng thao tác: đầu bút chưa thẳng vạch 0 (lệch ${fmt(Math.abs(off), 1)} cm). Hãy đặt một đầu vật ngang vạch số 0.`);
    if (eye !== 1) return rt.info("Chưa đúng thao tác: <b>mắt phải nhìn theo hướng vuông góc với cạnh thước</b> ở đầu kia của vật. Chọn “Mắt vuông góc”.");
    const right = Math.round(L / dc) * dc;
    if (Math.abs(v - right) < dc / 2 + 1e-6) rt.info(`<b>Chính xác!</b> Chiều dài bút chì là ${fmt(right, dc < 1 ? 1 : 0)} cm (đọc theo vạch chia gần nhất, ĐCNN ${fmt(dc, 1)} cm).`);
    else rt.info(`Chưa đúng. Đọc giá trị theo vạch chia gần nhất với đầu bút. Gợi ý: kết quả phải là bội số của ĐCNN ${fmt(dc, 1)} cm.`);
  }, true);
  rt.button("Vật khác", newObj);
  newObj();
  rt.drag(c, {
    down: p => { if (p.y > RY - 52 && p.y < RY - 10 && p.x > px - 5 && p.x < px + L * PX + 20) { drag = p.x - px; return; } return false; },
    move: p => { px = clamp(p.x - drag, 20, 780 - L * PX); if (Math.abs(px - X0) < 4) px = X0; },
    hover: p => p.y > RY - 52 && p.y < RY - 10 && p.x > px && p.x < px + L * PX
  });
  rt.loop(() => {
    c.clear(); const I = ink();
    // thước
    ctx.fillStyle = "#f6dc8a"; roundRect(ctx, X0 - 20, RY, 30 * PX + 40, 70, 6); ctx.fill(); ctx.strokeStyle = "#b8962e"; ctx.lineWidth = 1; ctx.stroke();
    for (let mm = 0; mm <= 300; mm++) {
      const x = X0 + mm / 10 * PX, isCm = mm % 10 === 0, half = mm % 5 === 0;
      if (dc === 1 && !isCm) continue; if (dc === 0.5 && !half) continue;
      ctx.strokeStyle = "#3a2a00"; ctx.lineWidth = isCm ? 1.4 : .8;
      ctx.beginPath(); ctx.moveTo(x, RY); ctx.lineTo(x, RY + (isCm ? 22 : half ? 15 : 9)); ctx.stroke();
      if (isCm) txt(ctx, String(mm / 10), x, RY + 34, { size: 11, align: "center", color: "#3a2a00" });
    }
    txt(ctx, "cm", X0 + 30 * PX + 6, RY + 55, { size: 11, color: "#3a2a00" });
    // bút chì
    const y = RY - 32, w = L * PX;
    ctx.fillStyle = "#e5a52e"; ctx.fillRect(px, y - 11, w - 30, 22);
    ctx.fillStyle = "#c98a18"; ctx.fillRect(px, y - 3, w - 30, 6);
    ctx.fillStyle = "#e9c99a"; ctx.beginPath(); ctx.moveTo(px + w - 30, y - 11); ctx.lineTo(px + w, y); ctx.lineTo(px + w - 30, y + 11); ctx.fill();
    ctx.fillStyle = "#333"; ctx.beginPath(); ctx.moveTo(px + w - 9, y - 3.3); ctx.lineTo(px + w, y); ctx.lineTo(px + w - 9, y + 3.3); ctx.fill();
    ctx.fillStyle = "#f08aa0"; ctx.fillRect(px - 14, y - 11, 14, 22); ctx.fillStyle = "#b8bec4"; ctx.fillRect(px - 2, y - 11, 6, 22);
    // dóng thẳng đầu trái (đầu tẩy không tính: dùng px là mép trái thân)
    ctx.setLineDash([4, 4]); ctx.strokeStyle = Math.abs(px - X0) < 1 ? "#1c8a4a" : "#c0392b"; ctx.beginPath(); ctx.moveTo(px, y - 20); ctx.lineTo(px, RY + 4); ctx.stroke(); ctx.setLineDash([]);
    // mắt và tia nhìn
    const tipX = px + w, ex = tipX + (eye - 1) * 110, ey = 40;
    ctx.strokeStyle = eye === 1 ? "#1c8a4a" : "#c0392b"; ctx.setLineDash([6, 5]); ctx.lineWidth = 1.5;
    const k = (RY - ey) / (y - ey); const hitX = ex + (tipX - ex) * k;
    ctx.beginPath(); ctx.moveTo(ex, ey + 12); ctx.lineTo(hitX, RY + 2); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "#fff"; ctx.strokeStyle = I; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(ex, ey, 18, 10, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#2b5d8a"; ctx.beginPath(); ctx.arc(ex, ey + 1, 6, 0, TAU); ctx.fill(); ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(ex, ey + 1, 2.5, 0, TAU); ctx.fill();
    txt(ctx, eye === 1 ? "Mắt nhìn vuông góc với thước" : "Mắt nhìn lệch: đọc sai!", ex, 14, { size: 12, align: "center", color: eye === 1 ? "#1c8a4a" : "#c0392b" });
    ctx.fillStyle = eye === 1 ? "#1c8a4a" : "#c0392b"; ctx.beginPath(); ctx.arc(hitX, RY + 2, 4, 0, TAU); ctx.fill();
    txt(ctx, "Kéo bút chì để đặt đầu bút thẳng vạch 0", 20, 300, { size: 12, color: muted(), w: 500 });
  });
};

/* Cân Roberval */
SIMS.balance = rt => {
  const c = rt.canvas(800, 420), ctx = c.ctx;
  const objs = [["Quả táo", 186], ["Hộp bút", 238], ["Cục tẩy", 23], ["Cốc nước", 317], ["Vật bí ẩn", Math.round(rand(40, 480))]];
  let cur = 0, mass = objs[0][1];
  const W8 = [200, 100, 50, 20, 20, 10, 5, 2, 2, 1];
  const onPan = new Array(W8.length).fill(false);
  let ang = 0, vel = 0;
  rt.seg(objs.map(o => o[0]), 0, i => { cur = i; mass = objs[i][1]; onPan.fill(false); });
  const roR = rt.readout("Tổng quả cân", "0 g"), roS = rt.readout("Trạng thái");
  const boxPos = i => ({ x: 532 + (i % 5) * 54, y: 352 + Math.floor(i / 5) * 40 });
  rt.drag(c, { down: p => {
    for (let i = 0; i < W8.length; i++) {
      const b = onPan[i] ? panPos(i) : boxPos(i);
      if (Math.abs(p.x - b.x) < 26 && Math.abs(p.y - b.y) < 18) { onPan[i] = !onPan[i]; return false; }
    } return false;
  }, hover: p => W8.some((_, i) => { const b = onPan[i] ? panPos(i) : boxPos(i); return Math.abs(p.x - b.x) < 26 && Math.abs(p.y - b.y) < 18; }) });
  const PX = 300, PY = 150, ARM = 180;
  function panPos(i) {
    const k = onPan.slice(0, i).filter(Boolean).length;
    const ex = PX + Math.cos(ang) * ARM, ey = PY + Math.sin(ang) * ARM;
    return { x: ex - 50 + (k % 3) * 50, y: ey - 54 - Math.floor(k / 3) * 30 };
  }
  rt.loop(dt => {
    const right = W8.reduce((s, w, i) => s + (onPan[i] ? w : 0), 0);
    const diff = mass - right; const target = clamp(-diff / 60, -0.22, 0.22) * (diff === 0 ? 0 : 1);
    vel += (target - ang) * 30 * dt; vel *= Math.pow(0.02, dt); ang += vel * dt * 4; ang = clamp(ang, -0.24, 0.24);
    roR(right + " g"); roS(diff === 0 ? "Thăng bằng" : diff > 0 ? "Bên vật nặng hơn" : "Bên quả cân nặng hơn");
    if (diff === 0) rt.info(`<b>Cân thăng bằng.</b> Khối lượng của ${objs[cur][0].toLowerCase()} = ${right} g = ${fmt(right / 1000, 3)} kg.`);
    else rt.info("Đặt quả cân lên đĩa phải. Bắt đầu từ quả cân lớn, nếu đòn cân lệch về bên quả cân thì đổi sang quả nhỏ hơn.");
    c.clear(); const I = ink();
    // chân cân
    ctx.fillStyle = "#56616d"; roundRect(ctx, PX - 160, 280, 320, 26, 8); ctx.fill();
    ctx.fillStyle = "#7d8995"; ctx.fillRect(PX - 12, PY, 24, 132);
    // kim và thang
    ctx.fillStyle = "#e9edf0"; roundRect(ctx, PX - 40, 200, 80, 40, 6); ctx.fill();
    for (let i = -4; i <= 4; i++) { ctx.strokeStyle = "#333"; ctx.lineWidth = i ? 1 : 2; ctx.beginPath(); ctx.moveTo(PX + i * 8, 228); ctx.lineTo(PX + i * 8, i ? 234 : 238); ctx.stroke(); }
    ctx.strokeStyle = "#c0392b"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(PX, PY); ctx.lineTo(PX - Math.sin(ang) * 82, PY + Math.cos(ang) * 82); ctx.stroke();
    // đòn
    ctx.save(); ctx.translate(PX, PY); ctx.rotate(ang); ctx.fillStyle = "#9aa6b2"; roundRect(ctx, -ARM - 10, -8, 2 * ARM + 20, 16, 6); ctx.fill(); ctx.restore();
    ctx.fillStyle = "#4b5560"; ctx.beginPath(); ctx.arc(PX, PY, 10, 0, TAU); ctx.fill();
    // hai đĩa
    [[-1, "#c9d2da"], [1, "#c9d2da"]].forEach(([s, col]) => {
      const ex = PX + s * Math.cos(ang) * ARM, ey = PY + s * Math.sin(ang) * ARM;
      ctx.fillStyle = "#7d8995"; ctx.fillRect(ex - 4, ey - 30, 8, 30);
      ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(ex, ey - 32, 78, 12, 0, 0, TAU); ctx.fill(); ctx.strokeStyle = "#7d8995"; ctx.stroke();
    });
    // vật bên trái
    const lx = PX - Math.cos(ang) * ARM, ly = PY - Math.sin(ang) * ARM - 44;
    drawThing(ctx, cur, lx, ly);
    txt(ctx, objs[cur][0] + (cur === 4 ? " (?)" : ""), lx, ly - 70, { size: 13, align: "center", color: I });
    // hộp quả cân
    ctx.fillStyle = isDark() ? "#1d3140" : "#e7eef1"; roundRect(ctx, 500, 304, 290, 108, 10); ctx.fill();
    txt(ctx, "Hộp quả cân (bấm để đặt lên đĩa)", 512, 320, { size: 12, color: muted() });
    W8.forEach((w, i) => { const b = onPan[i] ? panPos(i) : boxPos(i); drawWeight(ctx, b.x, b.y, w); });
  });
  function drawWeight(ctx, x, y, w) {
    const s = 0.55 + Math.log10(w + 1) * 0.28;
    ctx.fillStyle = "#c9a227"; roundRect(ctx, x - 20 * s, y - 14 * s, 40 * s, 30 * s, 5); ctx.fill();
    ctx.fillStyle = "#a88411"; ctx.fillRect(x - 6 * s, y - 22 * s, 12 * s, 9 * s);

SIMS.pendulum = rt => {

    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bx, by, 16, 0, TAU); ctx.fill();
    ctx.setLineDash([3, 5]); ctx.strokeStyle = muted(); ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox, oy + len + 30); ctx.stroke(); ctx.setLineDash([]);

    ctx.strokeStyle = "#3a4450"; ctx.lineWidth = 8; ctx.stroke();
    for (let i = 0; i < 60; i++) { const a = i / 60 * TAU - Math.PI / 2; const r1 = i % 5 ? R - 10 : R - 18; ctx.strokeStyle = "#222"; ctx.lineWidth = i % 5 ? 1 : 2; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); ctx.lineTo(cx + Math.cos(a) * (R - 4), cy + Math.sin(a) * (R - 4)); ctx.stroke(); if (i % 5 === 0) txt(ctx, String(i || 60), cx + Math.cos(a) * (R - 32), cy + Math.sin(a) * (R - 32), { size: 12, align: "center", color: "#222" }); }

SIMS.thermo = rt => {
  const c = rt.canvas(800, 440), ctx = c.ctx;
  let T = 0, ice = 1, water = 1, power = 0, kind = 0, bubbles = [];
  rt.slider({ label: "Ngọn lửa đèn cồn", min: 0, max: 3, step: 1, value: 0, onInput: v => power = v });
  rt.seg(["Nhiệt kế rượu (−30 → 110 °C)", "Nhiệt kế y tế (35 → 42 °C)"], 0, i => kind = i);
  rt.button("Làm lại", () => { T = 0; ice = 1; water = 1; });
  const roC = rt.readout("Nhiệt kế chỉ"), roF = rt.readout("Đổi sang °F"), roS = rt.readout("Trạng thái");
  rt.loop(dt => {
    const sp = dt * 6; // tăng tốc thời gian
    const q = power * 2.2 * sp - (T - 25) * 0.012 * sp;
    if (ice > 0 && q > 0) { ice = Math.max(0, ice - q * 0.03); T = 0; }
    else if (ice > 0 && q <= 0) T = 0;
    else if (T >= 100 && q > 0) { T = 100; water = Math.max(0.55, water - q * 0.0012); }
    else T = clamp(T + q * 0.32, -5, 100);
    if (T >= 100 && power > 0 && Math.random() < 0.6) bubbles.push({ x: rand(300, 470), y: 330, v: rand(40, 90) });
    if (T > 70 && T < 100 && power > 0 && Math.random() < 0.1) bubbles.push({ x: rand(300, 470), y: 330, v: rand(20, 40), small: 1 });
    const disp = kind === 1 ? clamp(T, 35, 42) : T;
    roC(kind === 1 && (T > 42) ? "> 42 °C (vượt GHĐ!)" : kind === 1 && T < 35 ? "< 35 °C (dưới GHĐ)" : fmt(T, 1) + " °C");
    roF(fmt(T * 1.8 + 32, 1) + " °F");
    roS(ice > 0 ? "Nước đá đang tan (0 °C)" : T >= 100 && power ? "Nước đang sôi (100 °C)" : T > 25.5 ? "Nước nóng lên" : "Nước ở nhiệt độ phòng");
    rt.info(kind === 1 && T > 42 ? "<b>Nguy hiểm:</b> nhiệt kế y tế chỉ đo được đến 42 °C. Dùng sai nhiệt kế có thể làm vỡ nhiệt kế!" : ice > 0 && power ? "Nước đá đang tan: nhiệt độ <b>giữ ở 0 °C</b> cho đến khi đá tan hết." : T >= 100 && power ? "Nước sôi: nhiệt độ <b>giữ ở 100 °C</b> dù vẫn đun." : "");
    c.clear();
    // giá đỡ, đèn cồn
    ctx.fillStyle = "#56616d"; ctx.fillRect(250, 342, 270, 8); ctx.fillRect(262, 350, 8, 70); ctx.fillRect(500, 350, 8, 70);
    ctx.fillStyle = "rgba(170,215,240,.55)"; roundRect(ctx, 350, 380, 70, 40, 8); ctx.fill();
    ctx.fillStyle = "#666"; ctx.fillRect(380, 368, 10, 14);
    if (power) { const h = 16 + power * 14 + Math.sin(performance.now() / 70) * 3; const g = ctx.createRadialGradient(385, 362 - h / 2, 2, 385, 362 - h / 2, h); g.addColorStop(0, "rgba(255,240,180,.95)"); g.addColorStop(.5, "rgba(255,150,40,.8)"); g.addColorStop(1, "rgba(80,120,255,0)"); ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(385, 365 - h / 2, 10 + power * 2, h, 0, 0, TAU); ctx.fill(); }
    // cốc
    const top = 150, bot = 340, wl = bot - (bot - top - 30) * water * 0.85;
    const hot = clamp(T / 100, 0, 1);
    ctx.fillStyle = `rgba(${90 + hot * 120},${160 - hot * 40},${230 - hot * 120},.55)`; ctx.fillRect(282, wl, 206, bot - wl);
    for (let i = 0; i < 4; i++) { const s = 34 * Math.sqrt(ice); if (s < 3) break; ctx.fillStyle = "rgba(235,248,255,.9)"; ctx.strokeStyle = "rgba(150,200,230,.9)"; ctx.save(); ctx.translate(310 + i * 46, wl + 18 + (i % 2) * 8); ctx.rotate(i * .4); ctx.fillRect(-s / 2, -s / 2, s, s); ctx.strokeRect(-s / 2, -s / 2, s, s); ctx.restore(); }
    bubbles = bubbles.filter(b => (b.y -= b.v * dt) > wl); bubbles.forEach(b => { ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.beginPath(); ctx.arc(b.x, b.y, b.small ? 2 : 4, 0, TAU); ctx.stroke(); });
    if (T >= 99) for (let i = 0; i < 5; i++) { const y = wl - 20 - ((performance.now() / 20 + i * 30) % 120); ctx.fillStyle = `rgba(220,230,240,${.4 * (1 - (wl - y) / 140)})`; ctx.beginPath(); ctx.arc(320 + i * 35 + Math.sin(y / 10) * 6, y, 12, 0, TAU); ctx.fill(); }
    ctx.strokeStyle = ink(); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(278, top); ctx.lineTo(282, bot); ctx.lineTo(488, bot); ctx.lineTo(492, top); ctx.stroke();
    // nhiệt kế trong cốc
    const tx = 440, tTop = 70, tBot = 320;
    const lo = kind ? 35 : -30, hi = kind ? 42 : 110;
    const yOf = v => tBot - 20 - (clamp(v, lo, hi) - lo) / (hi - lo) * (tBot - 20 - tTop - 10);
    ctx.fillStyle = "rgba(240,248,252,.95)"; roundRect(ctx, tx - 9, tTop, 18, tBot - tTop, 9); ctx.fill(); ctx.strokeStyle = "#8aa"; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = kind ? "#888" : "#d12f2f"; ctx.beginPath(); ctx.arc(tx, tBot - 8, 11, 0, TAU); ctx.fill();
    ctx.fillRect(tx - 3, yOf(T), 6, tBot - 8 - yOf(T));

    txt(ctx, "°C", sx - 18, 58, { size: 12, color: muted(), align: "center" }); txt(ctx, "°F", sx + 74, 58, { size: 12, color: muted(), align: "center" });
    const Y = v => 380 - (v - lo) / (hi - lo) * 300;

    for (let v = lo; v <= hi; v += step) { ctx.strokeStyle = ink(); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx + 10, Y(v)); ctx.lineTo(sx + 22, Y(v)); ctx.stroke(); txt(ctx, String(v), sx - 6, Y(v), { size: 11, align: "right", color: ink() }); txt(ctx, fmt(v * 1.8 + 32, 0), sx + 40, Y(v), { size: 11, color: muted() }); }
    ctx.fillStyle = "rgba(240,248,252,1)"; roundRect(ctx, sx + 26, 72, 12, 316, 6); ctx.fill();
    ctx.fillStyle = kind ? "#888" : "#d12f2f"; ctx.fillRect(sx + 29, Y(clamp(T, lo, hi)), 6, 388 - Y(clamp(T, lo, hi)));
    if (!kind) { [[0, "nước đá tan"], [100, "nước sôi"]].forEach(([v, s]) => txt(ctx, s, sx + 112, Y(v), { size: 10, color: "#1c8a4a", align: "right" })); }
  });

SIMS.states = rt => {

  const N = 56, P = [];
  const box = { x: 40, y: 60, w: 300, h: 320 };
  for (let i = 0; i < N; i++) { const col = i % 8, row = Math.floor(i / 8); P.push({ hx: box.x + 66 + col * 24, hy: box.y + box.h - 20 - row * 24, x: 0, y: 0, vx: 0, vy: 0, m: 0 }); }
  P.forEach(p => { p.x = p.hx; p.y = p.hy; });
  const order = P.map((p, i) => i).sort((a, b) => P[a].hy - P[b].hy); // hạt trên cùng chuyển thể trước
  rt.seg(["Đun nóng", "Ngừng", "Làm lạnh"], 1, i => mode = [1, 0, -1][i]);
  rt.button("Làm lại", () => { H = 5; hist.length = 0; P.forEach(p => { p.m = 0; p.x = p.hx; p.y = p.hy; }); });
  const roT = rt.readout("Nhiệt độ"), roS = rt.readout("Thể của nước"), roP = rt.readout("Quá trình");
  const state = h => {
    if (h < 20) return { T: -20 + h, fm: 0, fb: 0 };
    if (h < 100) return { T: 0, fm: (h - 20) / 80, fb: 0 };
    if (h < 200) return { T: h - 100, fm: 1, fb: 0 };
    if (h < 320) return { T: 100, fm: 1, fb: (h - 200) / 120 };
    return { T: Math.min(120, 100 + h - 320), fm: 1, fb: 1 };
  };
  let acc = 0;
  rt.loop((dt, t) => {
    H = clamp(H + mode * 14 * dt, 0, 340);
    const s = state(H);
    acc += dt; if (acc > 0.2) { acc = 0; hist.push(s.T); if (hist.length > 200) hist.shift(); }
    const nm = Math.round(s.fm * N), nb = Math.round(s.fb * N);
    order.forEach((idx, k) => { P[idx].m = k < nb ? 2 : (k < nm ? 1 : 0); });

      if (p.m === 1) { p.vy += 420 * dt; p.vx += rand(-1, 1) * speed * 3 * dt; p.vy += rand(-1, 1) * speed * 3 * dt; p.vx *= 0.96; p.vy *= 0.96; }
      if (p.m === 2) { const v = Math.hypot(p.vx, p.vy) || 1; const want = speed * 2.6; p.vx = p.vx / v * want + rand(-5, 5); p.vy = p.vy / v * want + rand(-5, 5); }
      p.x += p.vx * dt; p.y += p.vy * dt;

      if (p.y < box.y + 9) { p.y = box.y + 9; p.vy = Math.abs(p.vy); } if (p.y > box.y + box.h - 9) { p.y = box.y + box.h - 9; p.vy = -Math.abs(p.vy) * (p.m === 2 ? 1 : 0.2); }
    }
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      const a = P[i], b = P[j]; if (a.m === 0 && b.m === 0) continue;
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy); if (d > 0 && d < 19) { const o = (19 - d) / 2, ux = dx / d, uy = dy / d; if (a.m) { a.x -= ux * o * (b.m ? 1 : 2); a.y -= uy * o * (b.m ? 1 : 2); } if (b.m) { b.x += ux * o * (a.m ? 1 : 2); b.y += uy * o * (a.m ? 1 : 2); } }

    ctx.strokeStyle = I; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(box.x, box.y); ctx.lineTo(box.x, box.y + box.h); ctx.lineTo(box.x + box.w, box.y + box.h); ctx.lineTo(box.x + box.w, box.y); ctx.stroke();
    for (const p of P) { const col = p.m === 0 ? "#7fb6e8" : p.m === 1 ? "#2e7dd7" : "#b9d6f2"; const g = ctx.createRadialGradient(p.x - 3, p.y - 3, 1, p.x, p.y, 9); g.addColorStop(0, "#ffffff"); g.addColorStop(1, col); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, TAU); ctx.fill(); }
    if (mode > 0) { for (let i = 0; i < 5; i++) { const fx = box.x + 40 + i * 55, h = 18 + Math.sin(t * 20 + i) * 4; ctx.fillStyle = "rgba(255,140,40,.85)"; ctx.beginPath(); ctx.moveTo(fx - 8, box.y + box.h + 30); ctx.quadraticCurveTo(fx, box.y + box.h + 30 - h * 2, fx + 8, box.y + box.h + 30); ctx.fill(); } }
    if (mode < 0) txt(ctx, "❄ làm lạnh", box.x + box.w / 2, box.y + box.h + 26, { color: "#2e7dd7", align: "center", size: 14 });
    txt(ctx, "Mô hình hạt", box.x, 40, { color: I, size: 14, w: 700 });
    // đồ thị

    txt(ctx, "Nhiệt độ theo thời gian", gx, 40, { color: I, size: 14, w: 700 });

    ctx.strokeStyle = muted(); ctx.lineWidth = 1; ctx.strokeRect(gx, gy, gw, gh);

    txt(ctx, "nóng chảy / đông đặc 0 °C", gx + gw - 6, Y(0) - 10, { size: 11, align: "right", color: "#b07b00" });
    txt(ctx, "sôi / ngưng tụ 100 °C", gx + gw - 6, Y(100) - 10, { size: 11, align: "right", color: "#b07b00" });
    ctx.strokeStyle = "#d9572b"; ctx.lineWidth = 2.5; ctx.beginPath(); hist.forEach((v, i) => { const x = gx + i / 200 * gw, y = Y(v); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke();

};

SIMS.oxygen = rt => {
  const c = rt.canvas(800, 420), ctx = c.ctx;
  let st = 0, gy = -200, o2 = 21, rise = 0, size = 1;
  rt.button("Úp cốc", () => { if (st === 0) st = 1; }, true);
  rt.button("Làm lại", () => { st = 0; gy = -200; o2 = 21; rise = 0; });
  rt.slider({ label: "Cỡ cốc", min: 0.8, max: 1.3, step: 0.1, value: 1, onInput: v => { if (st === 0) size = v; } });
  const roO = rt.readout("Oxygen trong cốc", "21 %"), roW = rt.readout("Mực nước dâng", "0");
  rt.loop((dt, t) => {
    if (st === 1) { gy += 260 * dt; if (gy >= 0) { gy = 0; st = 2; } }
    if (st === 2) { o2 = Math.max(0, o2 - dt * 3.2 / size); rise = (21 - o2) / 21; if (o2 <= 0.5) st = 3; }
    roO(fmt(o2, 0) + " %"); roW(rise > 0 ? "≈ " + fmt(rise / 5, 2).replace("0,", "0,") + " thể tích cốc" : "0");
    if (st === 3) rt.info("Nến tắt vì <b>hết oxygen</b> duy trì sự cháy. Nước dâng lên chiếm chỗ lượng oxygen đã mất, khoảng <b>1/5</b> thể tích cốc: oxygen chiếm khoảng 21% thể tích không khí.");
    else if (st === 2) rt.info("Nến vẫn cháy, tiêu thụ dần oxygen trong cốc. Quan sát ngọn lửa và mực nước.");
    c.clear(); const I = ink();
    // chậu nước
    const bx = 70, bw = 380, by = 300;
    ctx.fillStyle = "rgba(80,160,230,.45)"; ctx.fillRect(bx, by, bw, 70);
    ctx.strokeStyle = I; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(bx - 10, by - 30); ctx.lineTo(bx, 370); ctx.lineTo(bx + bw, 370); ctx.lineTo(bx + bw + 10, by - 30); ctx.stroke();
    // nến
    const cx = 260; ctx.fillStyle = "#f2efe6"; ctx.fillRect(cx - 12, 250, 24, 120); ctx.strokeStyle = "#ccc"; ctx.lineWidth = 1; ctx.strokeRect(cx - 12, 250, 24, 120);
    ctx.strokeStyle = "#333"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, 250); ctx.lineTo(cx, 242); ctx.stroke();
    const fs = st === 3 ? 0 : (st === 2 ? clamp(o2 / 21, 0.2, 1) : 1);
    if (fs > 0) { const h = 30 * fs + Math.sin(t * 25) * 2; const g = ctx.createRadialGradient(cx, 236 - h / 3, 1, cx, 236 - h / 3, h); g.addColorStop(0, "rgba(255,255,220,1)"); g.addColorStop(.4, "rgba(255,190,60,.95)"); g.addColorStop(1, "rgba(255,90,0,0)"); ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(cx, 238 - h / 2, 9 * fs + 3, h, 0, 0, TAU); ctx.fill(); }
    if (st === 3) { for (let i = 0; i < 6; i++) { const yy = 230 - ((t * 30 + i * 20) % 120); ctx.fillStyle = `rgba(150,150,150,${.35 * (1 - (230 - yy) / 120)})`; ctx.beginPath(); ctx.arc(cx + Math.sin(yy / 12 + i) * 8, yy, 6, 0, TAU); ctx.fill(); } }
    // cốc úp
    const gw = 150 * size, gh = 240 * size, gx0 = cx - gw / 2, gTop = 340 - gh + gy;
    const inner = gh - 40; const wl = 340 + gy - 40 - rise * inner / 5 * 1;
    if (st >= 2) { ctx.fillStyle = "rgba(80,160,230,.55)"; ctx.fillRect(gx0 + 3, wl, gw - 6, 340 - wl + 30); }
    ctx.fillStyle = "rgba(200,230,250,.18)"; ctx.fillRect(gx0, gTop, gw, gh);
    ctx.strokeStyle = "rgba(120,170,210,.95)"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(gx0, gTop + gh); ctx.lineTo(gx0, gTop); ctx.lineTo(gx0 + gw, gTop); ctx.lineTo(gx0 + gw, gTop + gh); ctx.stroke();
    if (st >= 2) { for (let k = 1; k <= 5; k++) { const yy = 340 - 40 - k * inner / 5; ctx.strokeStyle = "rgba(120,170,210,.8)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(gx0 + gw - 16, yy); ctx.lineTo(gx0 + gw, yy); ctx.stroke(); txt(ctx, k + "/5", gx0 + gw + 6, yy, { size: 10, color: muted() }); } }
    // biểu đồ thành phần không khí
    const px = 620, py = 190, R = 110;
    const parts = [[78, "#4a6fd1", "Nitrogen 78%"], [21, "#2fa36b", "Oxygen 21%"], [1, "#e7a10f", "Khí khác 1%"]];
    let a0 = -Math.PI / 2;
    parts.forEach(([v, col]) => { const a1 = a0 + v / 100 * TAU; ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(px, py); ctx.arc(px, py, R, a0, a1); ctx.closePath(); ctx.fill(); a0 = a1; });
    ctx.fillStyle = isDark() ? "#0f1f2a" : "#f7faf9"; ctx.beginPath(); ctx.arc(px, py, R * .55, 0, TAU); ctx.fill();
    txt(ctx, "Không khí", px, py, { size: 14, align: "center", color: I, w: 700 });
    parts.forEach(([, col, s], i) => { ctx.fillStyle = col; ctx.fillRect(px - 80, 330 + i * 24, 14, 14); txt(ctx, s, px - 58, 337 + i * 24, { size: 13, color: I }); });
    txt(ctx, "(khí khác: carbon dioxide, hơi nước, khí hiếm…)", px - 80, 404, { size: 11, color: muted(), w: 500 });
  });
  rt.info("Bấm <b>Úp cốc</b> để úp cốc thuỷ tinh lên ngọn nến đang cháy.");
};

SIMS.materials = rt => {
  const c = rt.canvas(800, 400), ctx = c.ctx;
  const M = [
    { n: "Kim loại (đồng)", col: "#c8793a", e: 1, k: 1, hit: "dent" }, { n: "Nhựa", col: "#3a8ad6", e: 0, k: 0.06, hit: "bend" },
    { n: "Gỗ", col: "#a0703f", e: 0, k: 0.05, hit: "dent" }, { n: "Cao su", col: "#3b3b3b", e: 0, k: 0.04, hit: "bounce" },
    { n: "Thuỷ tinh", col: "#9fd6e8", e: 0, k: 0.12, hit: "shatter" }, { n: "Gốm sứ", col: "#e9e2d2", e: 0, k: 0.1, hit: "crack" }
  ];
  let mi = 0, ti = 0, prog = 0, run = false; const res = M.map(() => [null, null, null]);

  rt.seg(["Dẫn điện", "Dẫn nhiệt", "Va đập"], 0, i => { ti = i; prog = 0; run = false; });
  rt.button("Thử", () => { prog = 0; run = true; }, true);
  rt.loop((dt, t) => {
    const m = M[mi];
    if (run) { prog = Math.min(1, prog + dt / (ti === 1 ? 6 : 1.6)); if (prog >= 1 && run) { run = false; record(); } }
    c.clear(); const I = ink();
    if (ti === 0) { // mạch điện
      ctx.strokeStyle = I; ctx.lineWidth = 3; ctx.strokeRect(80, 90, 360, 200);
      ctx.fillStyle = isDark() ? "#13232e" : "#f7faf9"; ctx.fillRect(200, 280, 120, 20); ctx.fillRect(170, 80, 180, 20);
      ctx.fillStyle = "#444"; ctx.fillRect(220, 272, 30, 36); ctx.fillStyle = "#c0392b"; ctx.fillRect(250, 278, 40, 24); txt(ctx, "Pin", 255, 324, { color: I, size: 12 });
      const on = run || prog >= 1 ? m.e : 0;
      ctx.fillStyle = m.col; ctx.fillRect(180, 82, 160, 16); txt(ctx, m.n, 260, 64, { color: I, size: 13, align: "center" });
      const g = ctx.createRadialGradient(80, 190, 2, 80, 190, on ? 70 : 20); g.addColorStop(0, on ? "rgba(255,240,150,1)" : "rgba(220,220,220,.9)"); g.addColorStop(1, on ? "rgba(255,220,80,0)" : "rgba(200,200,200,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(80, 190, on ? 70 : 22, 0, TAU); ctx.fill(); ctx.strokeStyle = I; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(80, 190, 18, 0, TAU); ctx.stroke();
      if (on && (run || prog >= 1)) for (let i = 0; i < 12; i++) { const s = ((t * 120 + i * 47) % 1120); const pt = s < 360 ? [80 + s, 90] : s < 560 ? [440, 90 + s - 360] : s < 920 ? [440 - (s - 560), 290] : [80, 290 - (s - 920)]; ctx.fillStyle = "#f2b636"; ctx.beginPath(); ctx.arc(pt[0], pt[1], 4, 0, TAU); ctx.fill(); }
    } else if (ti === 1) { // dẫn nhiệt
      ctx.fillStyle = "rgba(230,100,60,.35)"; ctx.fillRect(70, 230, 130, 120); ctx.strokeStyle = I; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(66, 200); ctx.lineTo(70, 350); ctx.lineTo(200, 350); ctx.lineTo(204, 200); ctx.stroke();
      txt(ctx, "Nước nóng 80 °C", 135, 372, { color: I, size: 12, align: "center" });
      for (let i = 0; i < 5; i++) { const yy = 225 - ((t * 25 + i * 14) % 60); ctx.strokeStyle = "rgba(200,200,200,.6)"; ctx.beginPath(); ctx.moveTo(90 + i * 22, yy); ctx.quadraticCurveTo(96 + i * 22, yy - 8, 90 + i * 22, yy - 16); ctx.stroke(); }
      const L = 300, front = clamp(prog * m.k * 4.2, 0, 1);
      ctx.save(); ctx.translate(120, 300); ctx.rotate(-0.35);
      const gr = ctx.createLinearGradient(0, 0, L, 0); gr.addColorStop(0, "#e5452c"); gr.addColorStop(Math.max(0.01, front * .95), "#f29a5c"); gr.addColorStop(Math.min(1, front + 0.05), m.col); gr.addColorStop(1, m.col);

      txt(ctx, "Giọt sáp ở đầu kia", 400, 160, { color: muted(), size: 12, w: 500 });
      txt(ctx, front > 0.9 ? "Sáp đã chảy: dẫn nhiệt tốt" : prog >= 1 ? "Đầu kia vẫn nguội: dẫn nhiệt kém" : "Đang chờ…", 400, 182, { color: I, size: 13 });
    } else { // va đập
      const ph = prog; const hy = ph < .4 ? 60 + ph / .4 * 150 : 210 - (ph - .4) * 100;
      const sx = 260, sy = 280;
      if (ph > 0.4 && (m.hit === "shatter")) { for (let i = 0; i < 12; i++) { const a = i / 12 * TAU, d = (ph - .4) * 140; ctx.fillStyle = m.col; ctx.beginPath(); ctx.moveTo(sx + Math.cos(a) * d, sy - 10 + Math.sin(a) * d * .5); ctx.lineTo(sx + Math.cos(a + .3) * (d + 14), sy - 10 + Math.sin(a + .3) * (d + 14) * .5); ctx.lineTo(sx + Math.cos(a + .1) * (d + 4), sy + Math.sin(a + .1) * d * .5); ctx.fill(); } }
      else {
        const squash = m.hit === "bounce" && ph > .38 && ph < .6 ? 0.6 : 1, bend = m.hit === "bend" && ph > .4 ? 10 : 0, dent = m.hit === "dent" && ph > .4 ? 6 : 0;
        ctx.fillStyle = m.col; ctx.beginPath(); ctx.moveTo(sx - 120, sy - 20 * squash); ctx.quadraticCurveTo(sx, sy - 20 * squash + bend + dent * 2, sx + 120, sy - 20 * squash); ctx.lineTo(sx + 120, sy + 20); ctx.quadraticCurveTo(sx, sy + 20 + bend, sx - 120, sy + 20); ctx.fill();
        if (m.hit === "crack" && ph > .4) { ctx.strokeStyle = "#333"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(sx, sy - 18); ctx.lineTo(sx + 8, sy - 4); ctx.lineTo(sx - 4, sy + 6); ctx.lineTo(sx + 6, sy + 20); ctx.stroke(); }
      }

      ctx.fillStyle = "#56616d"; ctx.fillRect(sx - 140, sy + 20, 280, 14);
    }
    // bảng kết quả
    const tx = 500; txt(ctx, "Bảng kết quả", tx, 30, { color: I, size: 14, w: 700 });
    ["Dẫn điện", "Dẫn nhiệt", "Va đập"].forEach((h, j) => txt(ctx, h, tx + 128 + j * 58, 58, { color: muted(), size: 11, align: "center" }));
    M.forEach((mm, i) => { const y = 86 + i * 46; ctx.fillStyle = i === mi ? "rgba(11,125,99,.15)" : "transparent"; ctx.fillRect(tx - 6, y - 18, 300, 36); txt(ctx, mm.n, tx, y, { color: I, size: 12 }); res[i].forEach((r, j) => txt(ctx, r == null ? "·" : r, tx + 128 + j * 58, y, { color: r == null ? muted() : I, size: 11, align: "center" })); });
  });
  function record() {
    const m = M[mi];
    const v = ti === 0 ? (m.e ? "Có" : "Không") : ti === 1 ? (m.k > .5 ? "Tốt" : m.k > .09 ? "Kém" : "Rất kém") : ({ dent: "Móp", bend: "Cong", bounce: "Đàn hồi", shatter: "Vỡ vụn", crack: "Nứt" })[m.hit];
    res[mi][ti] = v;
    rt.info(`<b>${m.n}</b> – ${["dẫn điện", "dẫn nhiệt", "khi va đập"][ti]}: <b>${v}</b>.` + (ti === 0 && m.e ? " Kim loại dẫn điện nên dùng làm lõi dây điện." : ti === 0 ? " Vật liệu cách điện, dùng làm vỏ dây điện, tay cầm dụng cụ." : ""));
  }
  rt.info("Chọn vật liệu và phép thử, rồi bấm <b>Thử</b>. Lần lượt thử tất cả để điền đầy bảng kết quả.");
};

SIMS.kiln = rt => {
  const c = rt.canvas(800, 420), ctx = c.ctx;
  const R = [
    { n: "Đá vôi", need: 900, inCol: "#d9d4c5", outCol: "#fbfbf6", out: "Vôi sống + khí carbon dioxide", use: "Vôi sống dùng trong xây dựng, khử chua đất; đá vôi còn là nguyên liệu sản xuất xi măng.", gas: true },
    { n: "Đất sét", need: 900, inCol: "#b77a4d", outCol: "#c4552f", out: "Gạch, ngói, đồ gốm", use: "Đất sét nặn hình rồi nung ở nhiệt độ cao thành gạch, ngói, đồ gốm cứng và bền." },
    { n: "Cát (+ đá vôi, soda)", need: 1400, inCol: "#e8d49a", outCol: "#a8dcf0", out: "Thuỷ tinh lỏng → thuỷ tinh", use: "Cát là nguyên liệu chính để sản xuất thuỷ tinh.", melt: true },
    { n: "Quặng sắt + than cốc", need: 1500, inCol: "#7a4b3a", outCol: "#ff8a2a", out: "Gang (sắt nóng chảy)", use: "Quặng sắt được luyện trong lò cao thành gang, từ gang luyện thành thép.", melt: true }
  ];
  let ri = 0, T = 25, prog = 0, set = 25;
  rt.seg(R.map(r => r.n), 0, i => { ri = i; prog = 0; });
  rt.slider({ label: "Nhiệt độ lò", min: 25, max: 1600, step: 25, value: 25, unit: "°C", onInput: v => set = v });
  rt.button("Nạp mẻ mới", () => prog = 0);
  const roT = rt.readout("Nhiệt độ trong lò"), roP = rt.readout("Đã chuyển hoá"), roO = rt.readout("Sản phẩm");
  const lumps = Array.from({ length: 22 }, (_, i) => ({ x: 300 + (i % 6) * 34 + rand(-4, 4), y: 300 - Math.floor(i / 6) * 28 + rand(-3, 3), r: rand(12, 16) }));
  rt.loop((dt, t) => {
    const r = R[ri];
    T += (set - T) * Math.min(1, dt * 1.5);
    if (T >= r.need) prog = Math.min(1, prog + dt * 0.12 * (1 + (T - r.need) / 300));
    roT(fmt(T, 0) + " °C"); roP(fmt(prog * 100, 0) + " %"); roO(prog > 0.05 ? r.out : "Chưa có");
    rt.info(T < r.need ? `${r.n} cần nung ở khoảng <b>${r.need} °C</b> trở lên. Tăng nhiệt độ lò.` : `<b>${r.out}.</b> ${r.use}`);
    c.clear(); const I = ink();
    // lò
    ctx.fillStyle = "#6d4c3d"; roundRect(ctx, 230, 60, 340, 320, 20); ctx.fill();
    ctx.fillStyle = "#3a2a22"; roundRect(ctx, 260, 90, 280, 250, 14); ctx.fill();
    const glow = clamp((T - 400) / 1100, 0, 1);
    ctx.fillStyle = `rgba(255,${120 + glow * 80},${40 + glow * 40},${glow * .55})`; roundRect(ctx, 260, 90, 280, 250, 14); ctx.fill();
    lumps.forEach((l, i) => {
      const done = i / lumps.length < prog;
      if (r.melt && done) return;
      ctx.fillStyle = done ? r.outCol : r.inCol; ctx.beginPath(); ctx.arc(l.x, l.y, l.r, 0, TAU); ctx.fill(); ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.stroke();
    });
    if (r.melt && prog > 0) { ctx.fillStyle = r.outCol; ctx.fillRect(270, 330 - prog * 40, 260, prog * 40); ctx.fillRect(560, 300, 10 + prog * 2, 60); ctx.beginPath(); ctx.ellipse(600, 370, 30 * prog + 6, 8, 0, 0, TAU); ctx.fill(); txt(ctx, "chảy ra", 600, 392, { size: 11, color: muted(), align: "center" }); }
    if (r.gas && T >= r.need && prog < 1) for (let i = 0; i < 8; i++) { const yy = 90 - ((t * 50 + i * 22) % 140); ctx.fillStyle = "rgba(190,190,190,.5)"; ctx.beginPath(); ctx.arc(400 + Math.sin(yy / 15 + i) * 20, yy + 40, 7, 0, TAU); ctx.fill(); }
    if (r.gas && T >= r.need) txt(ctx, "khí CO₂", 470, 22, { size: 12, color: muted() });
    ctx.fillStyle = "#4a3329"; ctx.fillRect(370, 20, 60, 42);
    // nhiệt kế lò
    ctx.fillStyle = isDark() ? "#13232e" : "#fff"; roundRect(ctx, 610, 60, 120, 300, 10); ctx.fill(); ctx.strokeStyle = muted(); ctx.stroke();
    const Y = v => 340 - v / 1600 * 260;
    ctx.fillStyle = "#d12f2f"; ctx.fillRect(660, Y(T), 14, 340 - Y(T));
    [0, 400, 800, 1200, 1600].forEach(v => txt(ctx, v + "°", 654, Y(v), { size: 11, align: "right", color: I }));
    ctx.strokeStyle = "#1c8a4a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(656, Y(r.need)); ctx.lineTo(724, Y(r.need)); ctx.stroke(); txt(ctx, "cần " + r.need + "°", 690, Y(r.need) - 10, { size: 10, color: "#1c8a4a", align: "center" });
    // nguyên liệu → sản phẩm
    txt(ctx, "Nguyên liệu", 40, 120, { size: 13, color: muted() }); txt(ctx, r.n, 40, 142, { size: 15, color: I, w: 700 });
    txt(ctx, "Sản phẩm", 40, 200, { size: 13, color: muted() });
    r.out.split(" + ").forEach((s, i) => txt(ctx, s, 40, 222 + i * 20, { size: 14, color: prog > .05 ? I : muted(), w: 600 }));
  });
};

SIMS.fuel = rt => {
  const c = rt.canvas(800, 420), ctx = c.ctx;
  const F = [{ n: "Củi", P: 1.0, eff: .15, q: 16, smoke: .9, col: "#8a5a32" }, { n: "Than", P: 1.4, eff: .25, q: 27, smoke: .6, col: "#2b2b2b" }, { n: "Cồn", P: 1.2, eff: .3, q: 27, smoke: .1, col: "#9fd6e8" }, { n: "Khí gas", P: 2.2, eff: .5, q: 46, smoke: .03, col: "#5a7fb5" }];
  const AIR = [{ n: "Thiếu không khí", k: .55, s: 2.4 }, { n: "Vừa đủ", k: 1, s: 1 }, { n: "Thừa nhiều", k: .8, s: .8 }];
  let fi = 0, ai = 1, run = false, T = 25, used = 0, time = 0, puffs = [];
  rt.seg(F.map(f => f.n), 0, i => { fi = i; reset(); });
  rt.seg(AIR.map(a => a.n), 1, i => { ai = i; });
  const b = rt.button("Đốt", () => { run = !run; b.textContent = run ? "Tắt bếp" : "Đốt"; }, true);
  rt.button("Làm lại", reset);
  function reset() { run = false; T = 25; used = 0; time = 0; b.textContent = "Đốt"; }
  const roT = rt.readout("Nhiệt độ nước"), roU = rt.readout("Nhiên liệu đã dùng"), roTm = rt.readout("Thời gian (thực)");
  rt.loop((dt, t) => {
    const f = F[fi], a = AIR[ai];
    if (run && T < 100) { const sdt = dt * 20; const Pu = f.P * a.k; T = Math.min(100, T + Pu * sdt / 4.2); used += Pu / f.eff / f.q * sdt; time += sdt; }
    if (run && T >= 100 && b.textContent !== "Tắt bếp") b.textContent = "Tắt bếp";
    roT(fmt(T, 0) + " °C"); roU(fmt(used, 0) + " g"); roTm(Math.floor(time / 60) + " phút " + Math.floor(time % 60) + " giây");
    if (T >= 100) rt.info(`Nước sôi sau <b>${Math.floor(time / 60)} phút ${Math.floor(time % 60)} giây</b>, dùng hết <b>${fmt(used, 0)} g ${f.n.toLowerCase()}</b>. ${ai === 0 ? "Thiếu không khí: nhiên liệu cháy không hết, toả ít nhiệt, sinh nhiều khói và khí độc carbon monoxide." : ai === 2 ? "Thừa quá nhiều không khí: một phần nhiệt bị không khí mang đi." : "Cung cấp vừa đủ không khí giúp nhiên liệu cháy hoàn toàn, hiệu quả."}`);
    else if (run) rt.info(ai === 0 ? "Ngọn lửa nhỏ, đỏ và nhiều khói đen vì <b>thiếu oxygen</b>." : "Nhiên liệu đang cháy, toả nhiệt đun nóng nước.");
    c.clear(); const I = ink();

SIMS.surfaceVolume = rt => {
  const c = rt.canvas(800, 330), ctx = c.ctx;
  let a = 1, shown = 1;
  rt.slider({ label: "Cạnh tế bào (hình lập phương)", min: 1, max: 6, step: 0.5, value: 1, unit: "µm", onInput: v => a = v });
  const roS = rt.readout("Diện tích bề mặt S = 6a²"), roV = rt.readout("Thể tích V = a³"), roR = rt.readout("Tỉ lệ S/V");
  rt.loop(dt => {
    shown += (a - shown) * Math.min(1, dt * 6);
    const S = 6 * a * a, V = a * a * a, r = S / V;
    roS(fmt(S, 1) + " µm²"); roV(fmt(V, 1) + " µm³"); roR(fmt(r, 2));
    rt.info(a <= 1.5 ? "Tế bào nhỏ: <b>S/V lớn</b>, mỗi phần thể tích được phục vụ bởi nhiều bề mặt, trao đổi chất dễ dàng." : `Cạnh tăng ${fmt(a, 1)} lần thì S tăng ${fmt(a * a, 1)} lần nhưng V tăng tới ${fmt(V, 1)} lần: <b>S/V giảm</b>, bề mặt không đủ cho nhu cầu bên trong. Vì vậy hầu hết tế bào có kích thước rất nhỏ.`);
    c.clear(); const I = ink();
    const e = shown * 26, ox = 180, oy = 250, dx = e * .6, dy = e * .35;
    ctx.fillStyle = "#f7becd"; ctx.strokeStyle = "#c2417a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.rect(ox - e / 2, oy - e, e, e); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#f29ab2"; ctx.beginPath(); ctx.moveTo(ox + e / 2, oy); ctx.lineTo(ox + e / 2 + dx, oy - dy); ctx.lineTo(ox + e / 2 + dx, oy - e - dy); ctx.lineTo(ox + e / 2, oy - e); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#fbd6e0"; ctx.beginPath(); ctx.moveTo(ox - e / 2, oy - e); ctx.lineTo(ox - e / 2 + dx, oy - e - dy); ctx.lineTo(ox + e / 2 + dx, oy - e - dy); ctx.lineTo(ox + e / 2, oy - e); ctx.closePath(); ctx.fill(); ctx.stroke();
    txt(ctx, `a = ${fmt(a, 1)} µm`, ox, oy + 20, { size: 13, align: "center", color: I });
    const bars = [["S (µm²)", S, 216, "#2e7dd7"], ["V (µm³)", V, 216, "#d9572b"], ["S/V", r, 6, "#3c9a2f"]];
    bars.forEach(([n, v, mx, col], k) => { const x = 420 + k * 120, h = v / mx * 220; ctx.fillStyle = col; ctx.fillRect(x, 270 - h, 64, h); txt(ctx, n, x + 32, 290, { size: 12, align: "center", color: I }); txt(ctx, fmt(v, k === 2 ? 2 : 1), x + 32, 260 - h, { size: 12, align: "center", color: I, w: 700 }); });
    ctx.strokeStyle = muted(); ctx.beginPath(); ctx.moveTo(400, 270); ctx.lineTo(780, 270); ctx.stroke();
  });
};
